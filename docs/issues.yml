        workflows; stale commondevops pin; shellcheck SC2250 / actionlint debt.
      goal: >-
        Fail closed on missing coverage when blocking; generate XML without
        mutating Doxyfile; require tools from the image; guard find; add
        concurrency (CI-002); pin commondevops @ 4.0.0; clear lint debt.
    architecture:
      target: scripts/ + .github/workflows/
      modules:
      - scripts/check-coverage.sh
      - scripts/check-doc-coverage.sh
      - scripts/run-metrixpp.sh
      - .github/workflows/
    acceptance_criteria:
    - Missing coverage.json fails when expected
    - Doxyfile on disk unchanged after doc gate
    - No pip install in gate scripts
    - commondevops uses:/scripts_ref at tag 4.0.0 SHA
    - actionlint + shellcheck clean on workflows/scripts
    guardrail_refs:
    - CI-002
    - CI-018
    - CI-023
    tasks:
