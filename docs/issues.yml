    architecture:
      target: .github/workflows/ci-cpp-image.yml
      modules:
      - .github/workflows/ci-cpp-image.yml
      - docs/workflows.md
    acceptance_criteria:
    - ci-cpp-image.yml calls containerdevops at a pinned SHA/tag
    - Triggers include release, schedule (<=30d), PR paths, workflow_dispatch
    - First publish lands with annotated release
    guardrail_refs:
    - CI-026
    - CI-027
    tasks:
    - id: CPPD-IMG-002-T1
      status: done
      title: Add ci-cpp-image.yml thin caller
      instructions:
        files:
        - .github/workflows/ci-cpp-image.yml
      verification:
      - rg -n 'container-publish|ci-cpp|schedule' .github/workflows/ci-cpp-image.yml
      guardrail_refs:
      - CI-026
      - CI-027

  - id: CPPD-WF-001
    status: done
    title: Vendor C++ thresholds and stop baking numeric gates
    overview:
      problem: >-
        Sparse checkout of scripts + docs/guardrails/cpp does not initialize
        the guardrails submodule, so every threshold read fails in CI.
        Metrix++ hardcodes CCN 10; dead workflow inputs declare coverage
        thresholds the scripts ignore (CI-021/022).
      goal: >-
        Vendor scripts/cpp.profile.thresholds.yml (sibling pattern); drift
        check vs submodule; scripts read CCN/coverage from the vendored file;
        remove unused coverage inputs from workflow_call contracts.
    architecture:
      target: scripts/ + .github/workflows/
      modules:
      - scripts/cpp.profile.thresholds.yml
      - scripts/read-thresholds.sh
      - scripts/run-metrixpp.sh
      - .github/workflows/cpp-quality.yml
      - .github/workflows/cpp-tests.yml
      - .github/workflows/cpp-docs.yml
    acceptance_criteria:
    - Thresholds available without submodule init in sparse checkout
    - Metrix++ CCN comes from max_cyclomatic_complexity
    - Dead statement_coverage/branch_coverage/doc_coverage inputs removed
    guardrail_refs:
    - CI-021
    - CI-022
    tasks:
    - id: CPPD-WF-001-T1
      status: done
      title: Vendor thresholds and wire scripts/workflows
      instructions:
        files:
        - scripts/
        - .github/workflows/
      verification:
      - test -f scripts/cpp.profile.thresholds.yml
      - "! rg -n 'cyclomatic:10' scripts/run-metrixpp.sh"
      guardrail_refs:
      - CI-021
      - CI-022

