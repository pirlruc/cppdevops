# Single-repo bootstrap for cppdevops labels and milestones.
targets:
  - repo: pirlruc/cppdevops
    yaml: docs/issues.yml

labels:
  - { name: epic, color: "5319E7", description: "Decision record" }
  - { name: task, color: "0E8A16", description: "Unit of work under an epic" }
  - { name: ai-architect, color: "7057FF", description: "Architecture or planning" }
  - { name: ai-implementer, color: "1D76DB", description: "Implementation" }
  - { name: ai-reviewer, color: "ededed", description: "Review or triage" }

milestones:
  - name: Phase 1 — Foundation
    description: Branch consolidation and initial externalization
  - name: Phase 2 — Modernization
    description: Shared quality, coverage, security, mobile, and infra workflows
  - name: Continuous improvement
    description: Follow-up epics from reviews and ops findings
