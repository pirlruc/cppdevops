# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow:     https://github.com/pirlruc/methodologies/blob/1.8.0/github-issue-adr/docs/process/guardrail-compliance.md
#
# Being stricter than the org default is always allowed and needs no entry here.

deviations:
  # DOCKER-PERF-001 image_max_size_mb 2000 retired: ci-cpp is a CI toolchain
  # image and uses ci_image_max_size_mb (2000) via size_class=ci_toolchain
  # (DOCKER-PERF-002 / CPPD-PIN-001).
  - id: SC-SIGN-001
    why: >-
      Private Free-plan repository; Sigstore keyless signing is unavailable.
      Image publish sets sign=false until the repo is public or a signing key
      is provisioned. Documented Free-plan pattern in guardrails 1.9.0
      supply-chain/guardrails.md. Registry provenance is mode=max without signing.
    epic: CPPD-IMG-002
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: CPP-BUILD-004
    why: >-
      Analysis runs on Debian 13 and Alpine 3.24. Ubuntu 24.04 stays the
      compile-and-ctest image (ci-cpp-ubuntu) and the devcontainer. The pack
      still names Ubuntu as the development reference OS; GR-CPP-001 asks to
      limit this ID to compile and ctest.
    epic: CPPD-IMG-003
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2027-01-31
  - id: CI-032
    why: >-
      A user-owned private repository on GitHub Free cannot protect the
      default branch or tags. Callers pin this repo by commit SHA (CI-018).
      Do not add a ruleset that only exists while the repository is public.
    epic: CPPD-PIN-003
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: REL-PUB-004
    why: >-
      GitHub Environments restricted to tag refs are not available on a
      private Free-plan user repository. Publish tokens stay in repository
      secrets.
    epic: CPPD-PIN-003
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
