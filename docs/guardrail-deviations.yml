# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow:     https://github.com/pirlruc/methodologies/blob/1.1.0/github-issue-adr/docs/process/guardrail-compliance.md
#
# Being stricter than the org default is always allowed and needs no entry here.

deviations:
  - id: DOCKER-PERF-001
    key: image_max_size_mb
    org_default: 300
    repo_value: 2000
    why: >-
      ci-cpp ships a full Clang/libc++/CMake/Ninja/valgrind/Doxygen toolchain on
      Ubuntu 24.04. Measured uncompressed rootfs via `du -sxm /` is 1065 MB
      (2026-08-12). Cannot meet the 300 MB org default without dropping the C++
      reference toolchain required by CPP-BUILD-004/009. Gate uses 2000 MB headroom.
      Layer efficiency measured 94.48% vs org floor 95% on the first CI build; Dockerfile
      was tightened (single apt+user RUN, drop unused curl/python3-venv) — re-measure after
      publish; keep this entry until efficiency stays ≥95 without a further override.
    epic: CPPD-IMG-001
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: SC-SIGN-001
    why: >-
      Repository is private; cosign keyless signing is enabled only when
      repository.visibility == public (same pattern as commondevops/containerdevops).
      Image publish sets sign=false for private Free-plan GHCR until the repo is public
      or a signing key is provisioned.
    epic: CPPD-IMG-002
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
