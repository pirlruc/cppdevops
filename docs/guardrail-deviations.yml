# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow:     https://github.com/pirlruc/methodologies/blob/1.9.2/github-issue-adr/docs/process/guardrail-compliance.md
#
# Being stricter than the org default is always allowed and needs no entry here.

deviations:
  # DOCKER-PERF-001 image_max_size_mb 2000 retired: ci-cpp is a CI toolchain
  # image and uses ci_image_max_size_mb (2000) via size_class=ci_toolchain
  # (DOCKER-PERF-002 / CPPD-PIN-001).
  - id: SC-SIGN-001
    why: >-
      The repository is public today, so publish signs while visibility stays
      public. It returns to private on the Free plan, where keyless signing
      stops (sign is keyed on visibility == public). Documented Free-plan
      pattern in guardrails supply-chain/guardrails.md. Registry provenance
      stays mode=max. The agent does not change visibility.
    epic: CPPD-IMG-002
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: CI-032
    why: >-
      The repository is public and has an active default-branch ruleset
      (deletion, non-fast-forward, and pull request). It returns to private
      on the Free plan, where that ruleset cannot be enforced. Callers pin
      this repo by commit SHA (CI-018). The ruleset stays for the public
      window and is not the private-repo control.
    epic: CPPD-PIN-003
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: REL-PUB-004
    why: >-
      GitHub Environments restricted to tag refs are not available on a
      private Free-plan user repository. Publish tokens stay in repository
      secrets.
    epic: CPPD-PIN-003
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
