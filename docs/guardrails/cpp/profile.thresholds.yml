# Org-default numeric gates for C++ repositories.
# CI should read this file as the single source of truth for thresholds.
# Repos may override values with a recorded justification (ADR required when lowering a gate).

statement_coverage: 95
branch_coverage: 95
doc_coverage: 95
max_cyclomatic_complexity: 10
min_maintainability_index: 40
lint_exception_max_days: 14
pr_size_soft_limit_lines: 500
