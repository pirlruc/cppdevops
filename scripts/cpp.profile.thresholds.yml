# Vendored from pirlruc/guardrails cpp/profile.thresholds.yml for reusable CI.
# Keep in sync when org C++ thresholds change; self-CI should drift-check vs
# docs/guardrails/cpp/profile.thresholds.yml when the submodule is present.
# Do not edit casually — prefer bumping the guardrails pin and re-copying.

# Org-default numeric gates for C++ repositories.
# CI should read this file as the single source of truth for thresholds.
# Repos may override values with a recorded justification (Epic required when lowering a gate).

statement_coverage: 95          # CPP-TEST-003
branch_coverage: 95             # CPP-TEST-003
doc_coverage: 95                # CPP-DOC-001
max_cyclomatic_complexity: 10   # CPP-CPLX-001
min_maintainability_index: 40   # CPP-CPLX-001
lint_exception_max_days: 14     # CPP-LINT-004
pr_size_soft_limit_lines: 500   # CPP-CHG-001
