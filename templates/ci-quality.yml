# CI quality caller template — copy to {library}/.github/workflows/ci-quality.yml
# Reusable workflows live in pirlruc/cppdevops. Pin at a tag or full SHA (CI-018);
# bump deliberately with changelog review (CI-019). Dependabot github-actions can
# update this file once it lands in a consumer's .github/workflows/.
#
# scripts_ref must equal the uses pin (CI-034). sync-library-tooling.sh replaces
# CPPDEVOPS_PIN with CPPDEVOPS_WORKFLOW_REF. Libraries pass CPP_READ_TOKEN, which
# needs contents:read on cppdevops, commondevops, and the private ports.
#
# Push and pull_request run with blocking=true. workflow_dispatch stays advisory
# unless the caller passes blocking. run_ios is false so the macOS leg does not
# start. Vision libraries override container_image with the ci-cpp-opencv digest.

name: Quality

on:
  workflow_dispatch:
    inputs:
      blocking:
        description: Pass blocking=true when ready to enforce
        type: boolean
        default: false
      run_sbom:
        description: Run Syft/Grype/Trivy. Pull requests and pushes assume true.
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "**"
      - "!.github/dependabot.yml"
      - "!docs/**"
      - "!.cursor/**"
  pull_request:
    paths:
      - "**"
      - "!.github/dependabot.yml"
      - "!docs/**"
      - "!.cursor/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 / CI-031 — caller grants the union of scopes the callees request.
# A reusable workflow cannot widen this set.
permissions:
  actions: write
  contents: read
  packages: read
  security-events: write

jobs:
  quality:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-quality.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      use_vcpkg: true
      vcpkg_triplet: x64-linux-libcxx
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
  tests:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-tests.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      use_vcpkg: true
      vcpkg_triplet: x64-linux-libcxx
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
  docs:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-docs.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      vcpkg_triplet: x64-linux-libcxx
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
  security:
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/cppdevops/.github/workflows/cpp-security.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      run_sbom: ${{ github.event_name != 'workflow_dispatch' || inputs.run_sbom }}
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
  codeql:
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/cppdevops/.github/workflows/cpp-codeql.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      use_vcpkg: true
      vcpkg_triplet: x64-linux-libcxx
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
  dynamic:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-dynamic.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      use_vcpkg: true
      vcpkg_triplet: x64-linux-libcxx
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
  mobile:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-mobile-matrix.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      run_ios: false
      min_ndk: "26.1.10909125"
      min_xcode: "15.4"
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
  infra:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-infra.yml@CPPDEVOPS_PIN
    with:
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
