# CI quality caller template — copy to {library}/.github/workflows/ci-quality.yml
# Reusable workflows live in pirlruc/cppdevops. Pin at a tag or full SHA (CI-018);
# bump deliberately with changelog review (CI-019). Dependabot github-actions can
# update this file once it lands in a consumer's .github/workflows/.
#
# scripts_ref must equal the uses pin (CI-034). sync-library-tooling.sh replaces
# CPPDEVOPS_PIN with CPPDEVOPS_WORKFLOW_REF. Libraries pass CPP_READ_TOKEN, which
# needs contents:read on cppdevops, commondevops, and the private ports.
#
# Push and pull_request run with blocking=true. workflow_dispatch stays advisory
# unless the caller passes blocking. run_ios is false so the macOS leg does not
# start. Vision libraries override container_image with the ci-cpp-opencv digest.

name: Quality

on:
  workflow_dispatch:
    inputs:
      blocking:
        description: Pass blocking=true when ready to enforce
        type: boolean
        default: false
      run_sbom:
        description: Run Syft/Grype/Trivy. Pull requests and pushes assume true.
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "**"
      - "!.github/dependabot.yml"
      - "!docs/**"
      - "!.cursor/**"
  pull_request:
    paths:
      - "**"
      - "!.github/dependabot.yml"
      - "!docs/**"
      - "!.cursor/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 / CI-031 — caller grants the union of scopes the callees request.
# A reusable workflow cannot widen this set.
permissions:
  actions: write
  contents: read
  packages: read
  security-events: write

jobs:
  quality:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-quality.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      use_vcpkg: true
      vcpkg_triplet: x64-linux-libcxx
      tests_option: ""
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
  tests:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-tests.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      use_vcpkg: true
      vcpkg_triplet: x64-linux-libcxx
      tests_option: ""
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
  docs:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-docs.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      vcpkg_triplet: x64-linux-libcxx
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
  security:
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/cppdevops/.github/workflows/cpp-security.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      run_sbom: ${{ github.event_name != 'workflow_dispatch' || inputs.run_sbom }}
      upload_sarif: false
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
  codeql:
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/cppdevops/.github/workflows/cpp-codeql.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      use_vcpkg: true
      vcpkg_triplet: x64-linux-libcxx
      run_codeql: false
      tests_option: ""
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
  dynamic:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-dynamic.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      use_vcpkg: true
      vcpkg_triplet: x64-linux-libcxx
      tests_option: ""
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
  mobile:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-mobile-matrix.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      run_ios: false
      min_ndk: "26.1.10909125"
      min_xcode: "15.4"
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
  infra:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-infra.yml@CPPDEVOPS_PIN
    with:
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
  pins:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-pins.yml@CPPDEVOPS_PIN
    with:
      scripts_ref: CPPDEVOPS_PIN
  threshold-drift:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-threshold-drift.yml@CPPDEVOPS_PIN
    with:
      scripts_ref: CPPDEVOPS_PIN
  token-audit:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-token-audit.yml@CPPDEVOPS_PIN
    with:
      scripts_ref: CPPDEVOPS_PIN
  doc-verify:
    permissions:
      contents: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-doc-verify.yml@CPPDEVOPS_PIN
    with:
      scripts_ref: CPPDEVOPS_PIN
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      run_markdownlint: true
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
  fuzz:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/cppdevops/.github/workflows/cpp-fuzz.yml@CPPDEVOPS_PIN
    with:
      library_path: .
      scripts_ref: CPPDEVOPS_PIN
      run_fuzz: false
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      container_username: pirlruc
    secrets:
      checkout_token: ${{ secrets.CPP_READ_TOKEN }}
      container_token: ${{ secrets.GHCR_READ_TOKEN }}
  # CI-044. Docs-only pulls still run this job, so a required check exists
  # when the heavy jobs are skipped by a path filter.
  aggregate:
    if: always()
    needs:
      - quality
      - tests
      - docs
      - security
      - codeql
      - dynamic
      - mobile
      - infra
      - pins
      - threshold-drift
      - token-audit
      - doc-verify
      - fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail when a needed job failed
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          DOCS: ${{ needs.docs.result }}
          SECURITY: ${{ needs.security.result }}
          CODEQL: ${{ needs.codeql.result }}
          DYNAMIC: ${{ needs.dynamic.result }}
          MOBILE: ${{ needs.mobile.result }}
          INFRA: ${{ needs.infra.result }}
          PINS: ${{ needs.pins.result }}
          DRIFT: ${{ needs.threshold-drift.result }}
          TOKEN: ${{ needs.token-audit.result }}
          DOC: ${{ needs.doc-verify.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          set -eu
          failed=""
          for item in \
            "quality=${QUALITY}" "tests=${TESTS}" "docs=${DOCS}" \
            "security=${SECURITY}" "codeql=${CODEQL}" "dynamic=${DYNAMIC}" \
            "mobile=${MOBILE}" "infra=${INFRA}" "pins=${PINS}" \
            "threshold-drift=${DRIFT}" "token-audit=${TOKEN}" \
            "doc-verify=${DOC}" "fuzz=${FUZZ}"
          do
            name=${item%%=*}
            result=${item#*=}
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              failed="${failed} ${name}(${result})"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::Jobs failed:${failed}"
            exit 1
          fi
          echo "Aggregate passed."
