name: C++ Documentation (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      doc_coverage:
        required: false
        type: string
        default: '95'

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364edf1e46 # v4.2.2

      - name: Generate Doxygen
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          if [ -f Doxyfile ]; then doxygen Doxyfile; else echo "No Doxyfile — advisory skip"; fi

      - name: Doc coverage gate
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          echo "Doc coverage target: ${{ inputs.doc_coverage }}% (coverxygen in M7)"
