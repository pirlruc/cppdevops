name: C++ Documentation (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: Commit SHA matching the uses pin (required cross-repo, CI-034)
        required: false
        type: string
        default: ""

    secrets:
      checkout_token:
        required: false

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    container: ghcr.io/pirlruc/ci-cpp@sha256:3406477bb7fc730c53df4a28dffa07a9dce5ee6f6830102df1bedc8727973b67
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: docs-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
            templates/cpp/Doxyfile.in
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi


      - name: Generate Doxygen
        id: doxygen
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        run: |
          set -euo pipefail
          if [[ ! -f Doxyfile ]]; then
            bash "${GITHUB_WORKSPACE}/_cppdevops/scripts/generate-doxyfile.sh" "${PWD}"
          fi
          if [[ ! -f Doxyfile ]]; then
            echo "error: no Doxyfile (CI-035)" >&2
            exit 1
          fi
          doxygen Doxyfile

      - name: Doc coverage gate (coverxygen)
        id: coverage
        continue-on-error: true
        env:
          LIBRARY_PATH: ${{ inputs.library_path }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/check-doc-coverage.sh "${LIBRARY_PATH}"

      - name: Gate — docs
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ADVISORY: ${{ env.ADVISORY }}
          DOXYGEN: ${{ steps.doxygen.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            doxygen="${DOXYGEN}" \
            coverage="${COVERAGE}"
