name: C++ Documentation (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      doc_coverage:
        required: false
        type: string
        default: '95'

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364edf1e46 # v4.2.2

      - name: Checkout cppdevops scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364edf1e46 # v4.2.2
        with:
          repository: pirlruc/cppdevops
          path: _cppdevops
          sparse-checkout: |
            scripts
            docs/guardrails/cpp
          sparse-checkout-cone-mode: false

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz python3-pip
          pip3 install coverxygen

      - name: Generate Doxygen
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          if [ -f Doxyfile ]; then doxygen Doxyfile; else echo "No Doxyfile — advisory skip"; exit 0; fi

      - name: Doc coverage gate (coverxygen)
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          bash _cppdevops/scripts/check-doc-coverage.sh "${{ inputs.library_path }}" "${{ inputs.doc_coverage }}"
