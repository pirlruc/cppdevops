name: C++ Documentation (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
    secrets:
      checkout_token:
        required: false

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    # Prefer :local for host-built images until ghcr.io/pirlruc/ci-cpp is published.
    container: ghcr.io/pirlruc/ci-cpp:latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: docs-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Generate Doxygen
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          if [ -f Doxyfile ]; then doxygen Doxyfile; else echo "No Doxyfile — advisory skip"; exit 0; fi

      - name: Doc coverage gate (coverxygen)
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          LIBRARY_PATH: ${{ inputs.library_path }}
        run: |
          bash _cppdevops/scripts/check-doc-coverage.sh "${LIBRARY_PATH}"
