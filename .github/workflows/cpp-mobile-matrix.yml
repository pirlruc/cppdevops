name: C++ Mobile matrix (reusable)

# Cross-compile a header-including smoke TU on Android NDK and iOS Xcode
# (MOBILE-MECH-001 / CI-014 / CPP-BUILD-010/011). Pins: CPP-BUILD-012.
# This workflow is C++/NDK and Xcode only. It does not build Kotlin, Gradle,
# Compose, or Swift packages. Those jobs stay in the product repository.

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      min_ndk:
        required: false
        type: string
        default: "26.1.10909125"
      min_xcode:
        required: false
        type: string
        default: "15.4"
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: Commit SHA matching the uses pin (required cross-repo, CI-034)
        required: false
        type: string
        default: ""
      run_ios:
        description: Compile the iOS smoke TU. Pass false to skip the macOS runner.
        required: false
        type: boolean
        default: true

    secrets:
      checkout_token:
        required: false

# CI-025: workflow permissions are the union of the job permissions.
permissions:
  contents: read

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: mobile-android-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops smoke sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts/mobile-smoke
            scripts/gate-aggregate.sh
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi


      - name: Android NDK release name
        id: ndk_release
        env:
          MIN_NDK: ${{ inputs.min_ndk }}
        run: |
          set -eu
          case "${MIN_NDK}" in
            26.1.10909125|r26b) release=r26b ;;
            *) release="${MIN_NDK}" ;;
          esac
          echo "release=${release}" >> "${GITHUB_OUTPUT}"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: ${{ steps.ndk_release.outputs.release }}
          link-to-sdk: false

      - name: Android NDK smoke compile
        id: android_smoke
        continue-on-error: true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LIBRARY_PATH: ${{ inputs.library_path }}
          MIN_NDK: ${{ inputs.min_ndk }}
        run: |
          set -euo pipefail
          echo "library_path=${LIBRARY_PATH}"
          echo "NDK pin=${MIN_NDK}"
          echo "NDK home=${ANDROID_NDK_HOME}"
          mapfile -t CLANGS < <(
            find "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt" -type f \
              \( -name 'aarch64-linux-android24-clang++' -o -name 'aarch64-linux-android*-clang++' \) \
              | sort
          )
          if [[ ${#CLANGS[@]} -eq 0 ]]; then
            echo "::error::No aarch64-linux-android*-clang++ under ${ANDROID_NDK_HOME}"
            exit 1
          fi
          CXX="${CLANGS[0]}"
          echo "Using ${CXX}"
          OUT="${RUNNER_TEMP}/mobile-smoke-android/smoke"
          bash _cppdevops/scripts/mobile-smoke/compile.sh "${CXX}" "${OUT}" -fPIC
          echo "::notice::Android NDK smoke compile succeeded"

      - name: Gate — Android
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          SMOKE: ${{ steps.android_smoke.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh android_smoke="${SMOKE}"

  ios:
    if: inputs.run_ios
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: mobile-ios-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops smoke sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts/mobile-smoke
            scripts/gate-aggregate.sh
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi


      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ inputs.min_xcode }}

      - name: iOS Xcode smoke compile
        id: ios_smoke
        continue-on-error: true
        env:
          LIBRARY_PATH: ${{ inputs.library_path }}
          MIN_XCODE: ${{ inputs.min_xcode }}
        run: |
          set -euo pipefail
          echo "library_path=${LIBRARY_PATH}"
          echo "Xcode pin=${MIN_XCODE}"
          xcodebuild -version
          OUT="${RUNNER_TEMP}/mobile-smoke-ios/smoke"
          bash _cppdevops/scripts/mobile-smoke/compile.sh \
            "$(xcrun --sdk iphoneos --find clang++)" \
            "${OUT}" \
            -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "::notice::iOS Xcode smoke compile succeeded"

      - name: Gate — iOS
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          SMOKE: ${{ steps.ios_smoke.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh ios_smoke="${SMOKE}"
