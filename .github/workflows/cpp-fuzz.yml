name: C++ Fuzz (reusable)

# Builds and runs one libFuzzer target with ASan inside ci-cpp.
# A library with no fuzz target sets run_fuzz false (the default) and this
# job is skipped. Does not write fuzz targets for product libraries.
# C++/NDK and Swift are out of scope; this is a host libFuzzer job.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      library_path:
        description: Path to the library folder
        required: true
        type: string
      fuzz_target:
        description: CMake target that links libFuzzer
        required: false
        type: string
        default: ""
      fuzz_seconds:
        description: libFuzzer -max_total_time
        required: false
        type: string
        default: "30"
      run_fuzz:
        description: Set true only when fuzz_target exists
        required: false
        type: boolean
        default: false
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: Commit SHA matching the uses pin (required cross-repo, CI-034)
        required: false
        type: string
        default: ""
      container_username:
        description: >-
          Registry username for container_token. Empty uses github.actor.
          Set this when the package owner is another account.
        required: false
        type: string
        default: ""
      container_image:
        description: >-
          Image for the fuzz job. The default is ci-cpp. A library that
          needs OpenCV passes ci-cpp-opencv.
        required: false
        type: string
        default: ghcr.io/pirlruc/ci-cpp@sha256:c805d32471c3d05997922ee7ffdf1f4cf3fc6cfbf09a5eaf4cbbae0639786e84
      use_vcpkg:
        description: Run vcpkg manifest mode. The image must set VCPKG_ROOT.
        required: false
        type: boolean
        default: false
      vcpkg_triplet:
        description: Triplet for manifest installs. ci-cpp images ship x64-linux-libcxx.
        required: false
        type: string
        default: ""
      cxx_stdlib:
        description: >-
          Pass -stdlib=libc++ and link a libc++ libFuzzer. Required when the
          image's C++ libraries are libc++, because the system libFuzzer is
          libstdc++. Empty keeps -fsanitize=fuzzer.
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false
      container_token:
        required: false

# CI-025: workflow permissions are the union of the job permissions.
permissions:
  contents: read
  packages: read

# A called workflow sees the caller's name in github.workflow. Sharing that
# name across callees puts fuzz, infra, and security in one group, and GitHub
# cancels the pending ones before they get a runner.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-cpp-fuzz-{0}', github.ref)
        || format('call-cpp-fuzz-{0}-{1}-{2}', github.repository, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  fuzz:
    if: inputs.run_fuzz
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # The caller passes a digest. The default input is pinned.
    # zizmor: ignore[unpinned-images]
    container:
      image: ${{ inputs.container_image }}
      credentials:
        username: ${{ inputs.container_username || github.actor }}
        password: ${{ secrets.container_token || secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      USE_VCPKG: ${{ inputs.use_vcpkg }}
      VCPKG_TRIPLET: ${{ inputs.vcpkg_triplet }}
    defaults:
      run:
        # ci-cpp-opencv uses dash as /bin/sh, and dash rejects pipefail.
        shell: bash
        working-directory: ${{ inputs.library_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Restore vcpkg binary cache
        if: inputs.use_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-${{ inputs.vcpkg_triplet }}-${{ inputs.library_path }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      - name: Prepare vcpkg
        if: inputs.use_vcpkg
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ secrets.checkout_token }}
        run: sh _cppdevops/scripts/prepare-vcpkg.sh

      - name: Build fuzz target
        id: build
        continue-on-error: true
        env:
          FUZZ_TARGET: ${{ inputs.fuzz_target }}
          CXX_STDLIB: ${{ inputs.cxx_stdlib }}
        run: |
          set -euo pipefail
          if [ -z "${FUZZ_TARGET}" ]; then
            echo "run_fuzz is true but fuzz_target is empty" >&2
            exit 1
          fi
          # The system libFuzzer is libstdc++. A libc++ image links a rebuilt engine.
          sanitize="fuzzer,address"
          stdlib_flag=""
          engine=""
          if [ "${CXX_STDLIB}" = "libc++" ]; then
            sanitize="address,fuzzer-no-link"
            stdlib_flag="-stdlib=libc++"
            bash "${GITHUB_WORKSPACE}/_cppdevops/scripts/build-libfuzzer-libcxx.sh" \
              "${RUNNER_TEMP}/libfuzzer-libcxx"
            engine="${RUNNER_TEMP}/libfuzzer-libcxx/libFuzzer.a"
          fi
          flags="-fsanitize=${sanitize} ${stdlib_flag} -g"
          # The engine defines main, so it must not be on the compiler check link line.
          engine_arg=()
          if [ -n "${engine}" ]; then
            engine_arg=(-DLIBFUZZER_ENGINE="${engine}")
          fi
          # ci-cpp ships ninja and has no make, so the Unix Makefiles default cannot configure.
          sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${flags}" \
            -DCMAKE_EXE_LINKER_FLAGS="${flags}" \
            "${engine_arg[@]}"
          cmake --build build --target "${FUZZ_TARGET}" -j

      - name: Run libFuzzer
        id: run
        continue-on-error: true
        env:
          FUZZ_TARGET: ${{ inputs.fuzz_target }}
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
          CXX_STDLIB: ${{ inputs.cxx_stdlib }}
        run: |
          set -euo pipefail
          bin="$(find build -type f -name "${FUZZ_TARGET}" -print -quit)"
          if [ -z "${bin}" ]; then
            echo "fuzz binary not found: ${FUZZ_TARGET}" >&2
            exit 1
          fi
          # libc++ allocates exceptions with operator new. libc++abi frees them
          # with free. ASan reports that on a caught nlohmann parse_error.
          if [ "${CXX_STDLIB}" = "libc++" ]; then
            export ASAN_OPTIONS="${ASAN_OPTIONS:+${ASAN_OPTIONS},}alloc_dealloc_mismatch=0"
          fi
          "${bin}" "-max_total_time=${FUZZ_SECONDS}" "-timeout=10"

      - name: Gate
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/_cppdevops/scripts/gate-aggregate.sh" \
            build="${{ steps.build.outcome }}" \
            run="${{ steps.run.outcome }}"
