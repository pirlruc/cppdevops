name: Infra lint (reusable)

# Migrated to pirlruc/commondevops common-infra-lint.yml (actionlint, shellcheck,
# hadolint, zizmor). Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      blocking:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: .
      shell_scripts:
        required: false
        type: string
        default: ""
      dockerfiles:
        required: false
        type: string
        default: ""
      container_username:
        description: >-
          Registry username for container_token. Empty uses github.actor.
        required: false
        type: string
        default: ""
    secrets:
      # Required when the caller is a different private repo (CI-024).
      checkout_token:
        required: false
      container_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on lint errors
        type: boolean
        default: false
      runs_on:
        description: JSON value for runs-on. Default is the hosted ubuntu-24.04 label.
        type: string
        default: '"ubuntu-24.04"'

# CI-025: workflow permissions are the union of the job permissions.
permissions:
  contents: read
  packages: read

# github.workflow is the caller name here. Keep this group off the fuzz and security groups.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-cpp-infra-{0}', github.ref)
        || format('call-cpp-infra-{0}-{1}-{2}', github.repository, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  infra:
    # CI-024: Dependabot PRs cannot use Actions secrets for private reusables.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e # v6.9.0
    with:
      runs_on: ${{ inputs.runs_on }}
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory || '.' }}
      shell_scripts: ${{ inputs.shell_scripts || '' }}
      dockerfiles: ${{ inputs.dockerfiles || '' }}
      # Must match uses: @pin (CI-018).
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e
      container_image: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111
      container_username: ${{ inputs.container_username }}
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
      container_token: ${{ secrets.container_token }}
