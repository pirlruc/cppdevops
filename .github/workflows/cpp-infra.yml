name: Infra lint (reusable)

# Migrated to pirlruc/commondevops common-infra-lint.yml (actionlint, shellcheck,
# hadolint, zizmor). Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      blocking:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: .
      shell_scripts:
        required: false
        type: string
        default: ""
      dockerfiles:
        required: false
        type: string
        default: ""
    secrets:
      # Required when the caller is a different private repo (CI-024).
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on lint errors
        type: boolean
        default: false

# CI-025: default-deny; reusable jobs grant the minimum they need.
permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  infra:
    # CI-024: Dependabot PRs cannot use Actions secrets for private reusables.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@0b37bd52212bbe0d6eac70f955203d7582dfd9da
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory || '.' }}
      shell_scripts: ${{ inputs.shell_scripts || '' }}
      dockerfiles: ${{ inputs.dockerfiles || '' }}
      # Must match uses: @pin (CI-018).
      scripts_ref: 0b37bd52212bbe0d6eac70f955203d7582dfd9da
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
