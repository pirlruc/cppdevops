name: Infra lint (reusable)

# Migrated to pirlruc/commondevops common-infra-lint.yml (actionlint, shellcheck,
# hadolint, zizmor). Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      blocking:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: .
      shell_scripts:
        required: false
        type: string
        default: ""
      dockerfiles:
        required: false
        type: string
        default: ""
    secrets:
      # Required when the caller is a different private repo (CI-024).
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on lint errors
        type: boolean
        default: false

# CI-025: workflow permissions are the union of the job permissions.
permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  infra:
    # CI-024: Dependabot PRs cannot use Actions secrets for private reusables.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@c8ab7171a3897bddc58e3fd8c508529ca9803571
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory || '.' }}
      shell_scripts: ${{ inputs.shell_scripts || '' }}
      dockerfiles: ${{ inputs.dockerfiles || '' }}
      # Must match uses: @pin (CI-018).
      scripts_ref: c8ab7171a3897bddc58e3fd8c508529ca9803571
      container_image: ghcr.io/pirlruc/ci-lint@sha256:4d96a0235459c9e2cc724a724f42008dcdc3294940c57edb8b33b11e38efddba
