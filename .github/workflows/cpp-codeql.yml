name: C++ CodeQL (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      cmake_preset:
        required: false
        type: string
        default: ci-linux

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364edf1e46 # v4.2.2

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libc++-dev libc++abi-dev

      - name: Initialize CodeQL
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          config-file: ${{ inputs.library_path }}/.github/codeql/codeql-config.yml

      - name: Build
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          cmake --preset ${{ inputs.cmake_preset }} -DPIRLRUC_WITH_TESTS=OFF || \
            cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS='-stdlib=libc++'
          cmake --build build -j

      - name: Perform CodeQL Analysis
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
