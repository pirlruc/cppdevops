name: C++ CodeQL (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      run_codeql:
        description: >-
          A private repository without code scanning sets this false.
          The job still gates on SARIF findings when it runs.
        required: false
        type: boolean
        default: true
      tests_option:
        description: >-
          CMake option for CPP-BUILD-040, for example RUNA_BUILD_TESTS.
          Passed beside PIRLRUC_WITH_TESTS. This job passes OFF.
        required: false
        type: string
        default: ""
      cmake_preset:
        required: false
        type: string
        default: ci-linux
      scripts_ref:
        description: Commit SHA matching the uses pin (required cross-repo, CI-034)
        required: false
        type: string
        default: ""
      container_image:
        description: Image for this job. Default is ci-cpp, which includes vcpkg from 6.4.0. Callers on 6.3.0 still pass ci-cpp-vcpkg.
        required: false
        type: string
        default: ghcr.io/pirlruc/ci-cpp@sha256:8674685f88da7690e34418a32c52e37b832e339e290516a75a7dbf4f51932c30
      use_vcpkg:
        description: Run vcpkg manifest mode with a files binary cache. The image must set VCPKG_ROOT.
        required: false
        type: boolean
        default: false
      vcpkg_triplet:
        description: Triplet for manifest installs. ci-cpp images ship x64-linux-libcxx.
        required: false
        type: string
        default: ""

      container_username:
        description: >-
          Registry username for container_token. Empty uses github.actor.
          Set this when the package owner is another account.
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false
      container_token:
        required: false

# CI-025: default deny. Each job grants only what it uses.
permissions: {}

# ci-cpp-opencv ships dash as /bin/sh. Steps use pipefail.
defaults:
  run:
    shell: bash

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  codeql:
    # CI-024: CodeQL upload needs security-events; skip Dependabot secret path.
    if: inputs.run_codeql && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # CodeQL action runs on the job container; keep toolchain from ci-cpp.
    # Default input is a digest. Callers that override must pass a digest too.
    # zizmor: ignore[unpinned-images]
    container:
      image: ${{ inputs.container_image }}
      credentials:
        username: ${{ inputs.container_username || github.actor }}
        password: ${{ secrets.container_token || secrets.GITHUB_TOKEN }}
      options: --user root
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      USE_VCPKG: ${{ inputs.use_vcpkg }}
      VCPKG_TRIPLET: ${{ inputs.vcpkg_triplet }}
    concurrency:
      group: codeql-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Restore vcpkg binary cache
        if: inputs.use_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-${{ inputs.vcpkg_triplet }}-${{ inputs.library_path }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      - name: Prepare vcpkg
        if: inputs.use_vcpkg
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ secrets.checkout_token }}
        run: sh _cppdevops/scripts/prepare-vcpkg.sh

      - name: Initialize CodeQL
        id: init
        continue-on-error: true
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: cpp
          config-file: ${{ inputs.library_path }}/.github/codeql/codeql-config.yml

      - name: Build
        id: build
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        env:
          CMAKE_PRESET: ${{ inputs.cmake_preset }}
          TESTS_OPTION: ${{ inputs.tests_option }}
        run: |
          set -euo pipefail
          extra=""
          if [ -n "${TESTS_OPTION}" ]; then
            extra="-D${TESTS_OPTION}=OFF"
          fi
          # shellcheck disable=SC2086
          sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" --preset "${CMAKE_PRESET}" -DPIRLRUC_WITH_TESTS=OFF ${extra} || \
            sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS='-stdlib=libc++' -DPIRLRUC_WITH_TESTS=OFF ${extra}
          cmake --build build -j

      - name: Perform CodeQL Analysis
        id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:cpp"
          # Private repos without code scanning enabled reject the SARIF upload.
          upload: never
          output: codeql.sarif

      - name: Keep the SARIF
        if: always() && steps.analyze.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ inputs.library_path }}
          path: codeql.sarif
          if-no-files-found: error

      - name: Gate — SARIF findings
        if: always() && steps.analyze.outcome == 'success'
        env:
          ADVISORY: ${{ env.ADVISORY }}
        run: |
          set -euo pipefail
          count="$(python3 -c 'import json; d=json.load(open("codeql.sarif")); print(sum(len(r.get("results", [])) for r in d.get("runs", [])))')"
          echo "codeql_findings=${count}"
          if [ "${count}" != "0" ]; then
            echo "::error::CodeQL reported ${count} findings. upload is never, so the SARIF artifact is the record."
            if [ "${ADVISORY}" != "true" ]; then
              exit 1
            fi
          fi

      - name: Gate — CodeQL
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          INIT: ${{ steps.init.outcome }}
          BUILD: ${{ steps.build.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            init="${INIT}" \
            build="${BUILD}" \
            analyze="${ANALYZE}"
