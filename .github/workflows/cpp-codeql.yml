name: C++ CodeQL (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      cmake_preset:
        required: false
        type: string
        default: ci-linux

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  codeql:
    # CI-024: CodeQL upload needs security-events; skip Dependabot secret path.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # Prefer :local for host-built images until ghcr.io/pirlruc/ci-cpp is published.
    # CodeQL action runs on the job container; keep toolchain from ci-cpp.
    container: ghcr.io/pirlruc/ci-cpp:latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    concurrency:
      group: codeql-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: github/codeql-action/init@ea14db8afdef5d462e69d78c4ca45002d4522418 # v4.37.4
        with:
          languages: cpp
          config-file: ${{ inputs.library_path }}/.github/codeql/codeql-config.yml

      - name: Build
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          cmake --preset ${{ inputs.cmake_preset }} -DPIRLRUC_WITH_TESTS=OFF || \
            cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS='-stdlib=libc++'
          cmake --build build -j

      - name: Perform CodeQL Analysis
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: github/codeql-action/analyze@ea14db8afdef5d462e69d78c4ca45002d4522418 # v4.37.4
        with:
          category: "/language:cpp"
