name: C++ CodeQL (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      cmake_preset:
        required: false
        type: string
        default: ci-linux
      scripts_ref:
        description: Commit SHA matching the uses pin (required cross-repo, CI-034)
        required: false
        type: string
        default: ""
      container_image:
        description: Image for this job. Default is ci-cpp. Pass ci-cpp-vcpkg for manifest builds.
        required: false
        type: string
        default: ghcr.io/pirlruc/ci-cpp@sha256:3406477bb7fc730c53df4a28dffa07a9dce5ee6f6830102df1bedc8727973b67
      use_vcpkg:
        description: Run vcpkg manifest mode with a files binary cache. The image must set VCPKG_ROOT.
        required: false
        type: boolean
        default: false

    secrets:
      checkout_token:
        required: false

# CI-025: workflow permissions are the union of the job permissions.
permissions:
  actions: write
  contents: read
  security-events: write

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  codeql:
    # CI-024: CodeQL upload needs security-events; skip Dependabot secret path.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # CodeQL action runs on the job container; keep toolchain from ci-cpp.
    # Default input is a digest. Callers that override must pass a digest too.
    # zizmor: ignore[unpinned-images]
    container: ${{ inputs.container_image }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
      security-events: write
    env:
      USE_VCPKG: ${{ inputs.use_vcpkg }}
    concurrency:
      group: codeql-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Restore vcpkg binary cache
        if: inputs.use_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-${{ hashFiles(format('{0}/vcpkg.json', inputs.library_path), format('{0}/vcpkg-configuration.json', inputs.library_path)) }}
          restore-keys: vcpkg-

      - name: Prepare vcpkg
        if: inputs.use_vcpkg
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ secrets.checkout_token }}
        run: sh _cppdevops/scripts/prepare-vcpkg.sh

      - name: Initialize CodeQL
        id: init
        continue-on-error: true
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: cpp
          config-file: ${{ inputs.library_path }}/.github/codeql/codeql-config.yml

      - name: Build
        id: build
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        env:
          CMAKE_PRESET: ${{ inputs.cmake_preset }}
        run: |
          set -euo pipefail
          sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" --preset "${CMAKE_PRESET}" -DPIRLRUC_WITH_TESTS=OFF || \
            sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS='-stdlib=libc++'
          cmake --build build -j

      - name: Perform CodeQL Analysis
        id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:cpp"

      - name: Gate — CodeQL
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          INIT: ${{ steps.init.outcome }}
          BUILD: ${{ steps.build.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            init="${INIT}" \
            build="${BUILD}" \
            analyze="${ANALYZE}"
