name: C++ CodeQL (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      cmake_preset:
        required: false
        type: string
        default: ci-linux
    secrets:
      checkout_token:
        required: false

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  codeql:
    # CI-024: CodeQL upload needs security-events; skip Dependabot secret path.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # CodeQL action runs on the job container; keep toolchain from ci-cpp.
    container: ghcr.io/pirlruc/ci-cpp@sha256:f42b11bc342c0dd6faef6454f4a37cf4230b9c2c87357623cad5ed0102608656
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    concurrency:
      group: codeql-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Initialize CodeQL
        id: init
        continue-on-error: true
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: cpp
          config-file: ${{ inputs.library_path }}/.github/codeql/codeql-config.yml

      - name: Build
        id: build
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        env:
          CMAKE_PRESET: ${{ inputs.cmake_preset }}
        run: |
          set -euo pipefail
          cmake --preset "${CMAKE_PRESET}" -DPIRLRUC_WITH_TESTS=OFF || \
            cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS='-stdlib=libc++'
          cmake --build build -j

      - name: Perform CodeQL Analysis
        id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:cpp"

      - name: Gate — CodeQL
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          INIT: ${{ steps.init.outcome }}
          BUILD: ${{ steps.build.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            init="${INIT}" \
            build="${BUILD}" \
            analyze="${ANALYZE}"
