---
# Thin caller — one context per image name, matching commondevops:
# docker/ci-cpp (Debian unsuffixed and Alpine -alpine, both with vcpkg) and
# docker/ci-cpp-opencv. ci-cpp-ubuntu and ci-cpp-vcpkg stopped at 6.3.0.
# Devcontainers stay Ubuntu.
name: CI C++ Image

on:
  release:
    types: [published]
  schedule:
    - cron: "17 5 20 * *"
  pull_request:
    branches: [main]
    paths:
      - "docker/ci-cpp/**"
      - "docker/ci-cpp-opencv/**"
      - ".github/workflows/ci-cpp-image.yml"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false
      publish:
        description: Publish to GHCR/Hub (break-glass; also runs on release / schedule)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      dockerfile: docker/ci-cpp/Dockerfile
      working_directory: .
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      runner_image: ""
      run_infra_lint: false
      run_secrets_scan: true
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build:
    needs: [lint]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-cpp
      dockerfile: docker/ci-cpp/Dockerfile
      image_name: ci-cpp:ci
      artifact_name: container-image-ci-cpp
      handoff_package: ci-cpp
      structure_test_config: docker/ci-cpp/container-structure-test.yml
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      size_class: ci_toolchain
      image_title: ci-cpp
      image_description: >-
        Short-lived C++ CI toolchain: Clang/libc++, CMake, Ninja, vcpkg,
        cppcheck, clang-tidy/format, Doxygen, gcovr, lizard, Metrix++,
        libclang, valgrind. Debian 13. Non-root 1000:1000, linux/amd64.
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan:
    needs: build
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
      results_artifact: container-scan-results-ci-cpp
      sarif_category: trivy-image-ci-cpp
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      pkg_types: library
      ignorefile: docker/ci-cpp/.trivyignore.yaml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan-posture:
    needs: build
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
      results_artifact: container-scan-posture-ci-cpp
      sarif_category: trivy-posture-ci-cpp
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      pkg_types: os,library
      ignorefile: none
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish:
    needs: [build, scan]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-cpp
      dockerfile: docker/ci-cpp/Dockerfile
      image_name: ci-cpp
      dockerhub_image: pirlruc/ci-cpp
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      platforms: linux/amd64
      tag_suffix: -debian
      tag_alias_unsuffixed: true
      image_title: ci-cpp
      image_description: >-
        Short-lived C++ CI toolchain: Clang/libc++, CMake, Ninja, vcpkg,
        cppcheck, clang-tidy/format, Doxygen, gcovr, lizard, Metrix++,
        libclang, valgrind. Debian 13. Non-root 1000:1000, linux/amd64.
      image_documentation: https://hub.docker.com/r/pirlruc/ci-cpp
      image_url: https://hub.docker.com/r/pirlruc/ci-cpp
      image_vendor: pirlruc
      dockerhub_readme: docs/docker-hub-ci-cpp.md
      dockerhub_short_description: >-
        C++ CI toolchain: Clang/libc++, CMake, Ninja, quality and coverage tools
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      environment: ${{ github.event_name == 'release' && 'release' || '' }}
      verify_platforms: true
      verify_command: clang++ --version
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  cleanup:
    needs: [build, scan, publish]
    if: always() && needs.build.outputs.handoff_tag != '' && needs.publish.result != 'success'
    permissions:
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-handoff-cleanup.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      package: ${{ needs.build.outputs.handoff_package }}
      tag: ${{ needs.build.outputs.handoff_tag }}

  lint-alpine:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      dockerfile: docker/ci-cpp/Dockerfile.alpine
      working_directory: .
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      runner_image: ""
      run_infra_lint: false
      run_secrets_scan: true
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build-alpine:
    needs: [lint-alpine]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-cpp
      dockerfile: docker/ci-cpp/Dockerfile.alpine
      image_name: ci-cpp:ci-alpine
      artifact_name: container-image-ci-cpp-alpine
      handoff_package: ci-cpp
      structure_test_config: docker/ci-cpp/container-structure-test.yml
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      size_class: ci_toolchain
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan-alpine:
    needs: build-alpine
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
      results_artifact: container-scan-results-ci-cpp-alpine
      sarif_category: trivy-image-ci-cpp-alpine
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      pkg_types: library
      ignorefile: docker/ci-cpp/.trivyignore.yaml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish-alpine:
    needs: [build-alpine, scan-alpine]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-cpp
      dockerfile: docker/ci-cpp/Dockerfile.alpine
      image_name: ci-cpp
      dockerhub_image: pirlruc/ci-cpp
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      platforms: linux/amd64
      tag_suffix: -alpine
      tag_alias_unsuffixed: false
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      environment: ${{ github.event_name == 'release' && 'release' || '' }}
      image_title: ci-cpp
      image_description: >-
        C++ analysis toolchain plus vcpkg, Alpine 3.24, Clang 20. Non-root 1000:1000, linux/amd64.
      dockerhub_readme: docs/docker-hub-ci-cpp.md
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      verify_command: clang++ --version
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  lint-opencv:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      dockerfile: docker/ci-cpp-opencv/Dockerfile
      working_directory: .
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      runner_image: ""
      run_infra_lint: false
      run_secrets_scan: true
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build-opencv:
    needs: [lint-opencv]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-cpp-opencv
      dockerfile: docker/ci-cpp-opencv/Dockerfile
      image_name: ci-cpp-opencv:ci
      artifact_name: container-image-ci-cpp-opencv
      handoff_package: ci-cpp-opencv
      structure_test_config: docker/ci-cpp-opencv/container-structure-test.yml
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      size_class: ci_toolchain
      image_title: ci-cpp-opencv
      image_description: >-
        Compile image with OpenCV 4.14.0, Eigen 3.4, a libc++ vcpkg, and analysis tools.
        Non-root 1000:1000, linux/amd64.
      dhi_login: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan-opencv:
    needs: build-opencv
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-opencv.outputs.handoff_package, needs.build-opencv.outputs.digest) }}
      results_artifact: container-scan-results-ci-cpp-opencv
      sarif_category: trivy-image-ci-cpp-opencv
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      pkg_types: library
      ignorefile: docker/ci-cpp-opencv/.trivyignore.yaml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan-posture-opencv:
    needs: build-opencv
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-opencv.outputs.handoff_package, needs.build-opencv.outputs.digest) }}
      results_artifact: container-scan-posture-ci-cpp-opencv
      sarif_category: trivy-posture-ci-cpp-opencv
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      pkg_types: os,library
      ignorefile: none
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish-opencv:
    needs: [build-opencv, scan-opencv]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-cpp-opencv
      dockerfile: docker/ci-cpp-opencv/Dockerfile
      image_name: ci-cpp-opencv
      dockerhub_image: pirlruc/ci-cpp-opencv
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      platforms: linux/amd64
      image_title: ci-cpp-opencv
      image_description: >-
        Compile image with OpenCV 4.14.0, Eigen 3.4, a libc++ vcpkg, and analysis tools.
      dockerhub_readme: docs/docker-hub-ci-cpp-opencv.md
      dockerhub_short_description: C++ compile image with OpenCV 4.14 and Eigen 3.4
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: false
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      environment: ${{ github.event_name == 'release' && 'release' || '' }}
      verify_command: clang++ --version
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-opencv.outputs.handoff_package, needs.build-opencv.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  # REL-PUB-005. Append the published digests after every image publish succeeds.
  release-digests:
    needs: [publish, publish-alpine, publish-opencv]
    if: >-
      github.event_name == 'release' &&
      needs.publish.result == 'success' &&
      needs.publish-alpine.result == 'success' &&
      needs.publish-opencv.result == 'success'
    permissions:
      contents: write
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-release-digests.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      images: >-
        ghcr.io/${{ github.repository_owner }}/ci-cpp:${{ github.event.release.tag_name }}
        ghcr.io/${{ github.repository_owner }}/ci-cpp:${{ github.event.release.tag_name }}-alpine
        ghcr.io/${{ github.repository_owner }}/ci-cpp-opencv:${{ github.event.release.tag_name }}
