name: C++ Pins (reusable)

# Forwards to commondevops common-pins-verify. scripts_ref on this workflow
# is the cppdevops pin the library passes. The nested checkout uses the
# commondevops pin below. A cppdevops SHA is not a commondevops tree, so
# this workflow does not forward that input into the nested scripts_ref.

on:
  workflow_call:
    inputs:
      pin_script:
        required: false
        type: string
        default: scripts/check-submodule-pins.sh
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pins:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      pin_script: ${{ inputs.pin_script }}
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
