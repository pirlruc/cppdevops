name: C++ Pins (reusable)

# Forwards to commondevops common-pins-verify. scripts_ref on this workflow
# is the cppdevops pin the library passes. The nested checkout uses the
# commondevops pin below. A cppdevops SHA is not a commondevops tree, so
# this workflow does not forward that input into the nested scripts_ref.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      pin_script:
        required: false
        type: string
        default: scripts/check-submodule-pins.sh
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pins:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e # v6.9.0
    with:
      runs_on: ${{ inputs.runs_on }}
      pin_script: ${{ inputs.pin_script }}
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e
