name: C++ Security (reusable)

# Secrets/SAST and supply-chain legs live in pirlruc/commondevops.
# CodeQL stays in cpp-codeql.yml. Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      run_sbom:
        description: Run Syft/Grype/Trivy via common-supply-chain (SC-SBOM-001 default true)
        required: false
        type: boolean
        default: true
      scripts_ref:
        description: Accepted so callers can pass the uses pin. Nested calls use the pinned SHA.
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      library_path:
        type: string
        default: .
      blocking:
        type: boolean
        default: false
      run_sbom:
        type: boolean
        default: true

# CI-025: workflow permissions are the union of the job permissions.
permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  secrets-sast:
    # CI-024. The callee declares contents and packages. Extra scopes fail
    # the call at startup.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.library_path }}
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
      container_image: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111
  supply-chain:
    # CI-024; gated by run_sbom (default true for SC-SBOM-001).
    if: github.event.pull_request.user.login != 'dependabot[bot]' && inputs.run_sbom
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.library_path }}
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:dc83deb4465d5989a03b14ccabef46c3f3426231048b962c69b8e434a7200d48
