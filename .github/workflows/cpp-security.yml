name: C++ Security (reusable)

# Secrets/SAST and supply-chain legs live in pirlruc/commondevops.
# CodeQL stays in cpp-codeql.yml. Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      run_sbom:
        description: Run Syft/Grype/Trivy via common-supply-chain (SC-SBOM-001 default true)
        required: false
        type: boolean
        default: true
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      library_path:
        type: string
        default: .
      blocking:
        type: boolean
        default: false
      run_sbom:
        type: boolean
        default: true

# CI-025
permissions: {}

jobs:
  secrets-sast:
    # CI-024
    if: github.actor != 'dependabot[bot]'
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@74695e83a7b79784ee81fd970d9051d8efd711e8
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.library_path }}
      scripts_ref: 74695e83a7b79784ee81fd970d9051d8efd711e8
    secrets:
      checkout_token: ${{ secrets.checkout_token }}

  supply-chain:
    # CI-024; gated by run_sbom (default true for SC-SBOM-001).
    if: github.actor != 'dependabot[bot]' && inputs.run_sbom
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@74695e83a7b79784ee81fd970d9051d8efd711e8
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.library_path }}
      scripts_ref: 74695e83a7b79784ee81fd970d9051d8efd711e8
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
