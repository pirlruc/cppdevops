name: C++ Security (reusable)

# Secrets/SAST and supply-chain legs live in pirlruc/commondevops.
# CodeQL stays in cpp-codeql.yml. Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      run_sbom:
        description: Run Syft/Grype/Trivy via common-supply-chain (SC-SBOM-001 default true)
        required: false
        type: boolean
        default: true
      scripts_ref:
        description: >-
          Caller's cppdevops pin. Nested commondevops checkouts use the
          uses pin, because a cppdevops SHA is not a commondevops tree.
        required: false
        type: string
        default: ""
      upload_sarif:
        description: >-
          Upload the supply-chain SARIF. A private repository without code
          scanning sets this false. The caller still grants security-events.
        required: false
        type: boolean
        default: true
      container_username:
        description: >-
          Registry username for container_token. Empty uses github.actor.
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false
      container_token:
        required: false
  workflow_dispatch:
    inputs:
      library_path:
        type: string
        default: .
      blocking:
        type: boolean
        default: false
      run_sbom:
        type: boolean
        default: true
      upload_sarif:
        type: boolean
        default: true

# CI-025: each job grants its own scopes. No top-level write.
permissions: {}

# github.workflow is the caller name here. Keep this group off the fuzz and infra groups.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-cpp-security-{0}', github.ref)
        || format('call-cpp-security-{0}-{1}-{2}', github.repository, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  secrets-sast:
    # CI-024. The callee declares contents and packages. Extra scopes fail
    # the call at startup.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@c7751385f74edcf7f4ce1e64b408f225a38d9416
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.library_path }}
      scripts_ref: c7751385f74edcf7f4ce1e64b408f225a38d9416
      container_image: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111
      container_username: ${{ inputs.container_username }}
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
      container_token: ${{ secrets.container_token }}
  supply-chain:
    # CI-024; gated by run_sbom (default true for SC-SBOM-001).
    if: github.event.pull_request.user.login != 'dependabot[bot]' && inputs.run_sbom
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@c7751385f74edcf7f4ce1e64b408f225a38d9416
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.library_path }}
      scripts_ref: c7751385f74edcf7f4ce1e64b408f225a38d9416
      upload_sarif: ${{ inputs.upload_sarif }}
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:dc83deb4465d5989a03b14ccabef46c3f3426231048b962c69b8e434a7200d48
      container_username: ${{ inputs.container_username }}
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
      container_token: ${{ secrets.container_token }}
