name: C++ Security (reusable)

# Secrets/SAST and supply-chain legs live in pirlruc/commondevops.
# CodeQL stays in cpp-codeql.yml. Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      run_sbom:
        description: Run Syft/Grype/Trivy via common-supply-chain (SC-SBOM-001 default true)
        required: false
        type: boolean
        default: true
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      library_path:
        type: string
        default: .
      blocking:
        type: boolean
        default: false
      run_sbom:
        type: boolean
        default: true

# CI-025
permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  secrets-sast:
    # CI-024
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@1eaf78aedffbfc1921daa2623150db9fb722879d
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.library_path }}
      scripts_ref: 1eaf78aedffbfc1921daa2623150db9fb722879d
    secrets:
      checkout_token: ${{ secrets.checkout_token }}

  supply-chain:
    # CI-024; gated by run_sbom (default true for SC-SBOM-001).
    if: github.event.pull_request.user.login != 'dependabot[bot]' && inputs.run_sbom
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@1eaf78aedffbfc1921daa2623150db9fb722879d
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.library_path }}
      scripts_ref: 1eaf78aedffbfc1921daa2623150db9fb722879d
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
