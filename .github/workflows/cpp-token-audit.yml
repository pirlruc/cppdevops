name: C++ Token Audit (reusable)

on:
  workflow_call:
    inputs:
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""
    secrets:
      scorecard_token:
        required: false
      guardrails_token:
        required: false
      containerdevops_token:
        required: false
      checkout_token:
        required: false

permissions: {}

jobs:
  audit:
    permissions: {}
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@e41270c45b858cfa7a9f8404eaee781b5c29b61c
    with:
      scripts_ref: e41270c45b858cfa7a9f8404eaee781b5c29b61c
    secrets:
      scorecard_token: ${{ secrets.scorecard_token }}
      guardrails_token: ${{ secrets.guardrails_token }}
      containerdevops_token: ${{ secrets.containerdevops_token }}
      checkout_token: ${{ secrets.checkout_token }}
