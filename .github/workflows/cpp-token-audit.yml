name: C++ Token Audit (reusable)

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""
    secrets:
      scorecard_token:
        required: false
      guardrails_token:
        required: false
      containerdevops_token:
        required: false
      checkout_token:
        required: false

permissions: {}

jobs:
  audit:
    permissions: {}
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@a2af891c6d05fe2790bc5ddf761252c95185ce5f # v6.10.0
    with:
      runs_on: ${{ inputs.runs_on }}
      scripts_ref: a2af891c6d05fe2790bc5ddf761252c95185ce5f
    secrets:
      scorecard_token: ${{ secrets.scorecard_token }}
      guardrails_token: ${{ secrets.guardrails_token }}
      containerdevops_token: ${{ secrets.containerdevops_token }}
      checkout_token: ${{ secrets.checkout_token }}
