name: C++ Token Audit (reusable)

on:
  workflow_call:
    inputs:
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""
    secrets:
      scorecard_token:
        required: false
      guardrails_token:
        required: false
      containerdevops_token:
        required: false
      checkout_token:
        required: false

permissions: {}

jobs:
  audit:
    permissions: {}
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
    secrets:
      scorecard_token: ${{ secrets.scorecard_token }}
      guardrails_token: ${{ secrets.guardrails_token }}
      containerdevops_token: ${{ secrets.containerdevops_token }}
      checkout_token: ${{ secrets.checkout_token }}
