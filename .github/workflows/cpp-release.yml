name: C++ Release (reusable)

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      tag:
        required: true
        type: string
      attach_sbom:
        required: false
        type: boolean
        default: false
      sign:
        required: false
        type: boolean
        default: false
      sbom_artifact:
        required: false
        type: string
        default: common-supply-chain-results
      environment:
        required: false
        type: string
        default: ""
      release_artifact:
        required: false
        type: string
        default: ""
      release_files:
        required: false
        type: string
        default: ""
    secrets:
      release_token:
        required: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: pirlruc/commondevops/.github/workflows/common-release.yml@0e78652fa9f65b9d98033ac82bf9e5308ebb17a7
    with:
      runs_on: ${{ inputs.runs_on }}
      tag: ${{ inputs.tag }}
      attach_sbom: ${{ inputs.attach_sbom }}
      sign: ${{ inputs.sign }}
      sbom_artifact: ${{ inputs.sbom_artifact }}
      environment: ${{ inputs.environment }}
      release_artifact: ${{ inputs.release_artifact }}
      release_files: ${{ inputs.release_files }}
    secrets:
      release_token: ${{ secrets.release_token }}
