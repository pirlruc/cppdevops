name: C++ Release (reusable)

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      attach_sbom:
        required: false
        type: boolean
        default: false
      sign:
        required: false
        type: boolean
        default: false
      sbom_artifact:
        required: false
        type: string
        default: common-supply-chain-results
      environment:
        required: false
        type: string
        default: ""
      release_artifact:
        required: false
        type: string
        default: ""
      release_files:
        required: false
        type: string
        default: ""
    secrets:
      release_token:
        required: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pirlruc/commondevops/.github/workflows/common-release.yml@e41270c45b858cfa7a9f8404eaee781b5c29b61c
    with:
      tag: ${{ inputs.tag }}
      attach_sbom: ${{ inputs.attach_sbom }}
      sign: ${{ inputs.sign }}
      sbom_artifact: ${{ inputs.sbom_artifact }}
      environment: ${{ inputs.environment }}
      release_artifact: ${{ inputs.release_artifact }}
      release_files: ${{ inputs.release_files }}
    secrets:
      release_token: ${{ secrets.release_token }}
