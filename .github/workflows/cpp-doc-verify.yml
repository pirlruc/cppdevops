name: C++ Doc Verify (reusable)

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      blocking:
        required: false
        type: boolean
        default: false
      shell_scripts:
        required: false
        type: string
        default: ""
      ruff_paths:
        required: false
        type: string
        default: ""
      yaml_files:
        required: false
        type: string
        default: ""
      yaml_globs:
        required: false
        type: string
        default: ""
      run_link_lint:
        required: false
        type: boolean
        default: false
      run_markdownlint:
        required: false
        type: boolean
        default: false
      run_lychee:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@0e78652fa9f65b9d98033ac82bf9e5308ebb17a7
    with:
      runs_on: ${{ inputs.runs_on }}
      blocking: ${{ inputs.blocking }}
      shell_scripts: ${{ inputs.shell_scripts }}
      ruff_paths: ${{ inputs.ruff_paths }}
      yaml_files: ${{ inputs.yaml_files }}
      yaml_globs: ${{ inputs.yaml_globs }}
      run_link_lint: ${{ inputs.run_link_lint }}
      run_markdownlint: ${{ inputs.run_markdownlint }}
      run_lychee: ${{ inputs.run_lychee }}
      scripts_ref: 0e78652fa9f65b9d98033ac82bf9e5308ebb17a7
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
