name: C++ Threshold Drift (reusable)

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      drift_script:
        required: false
        type: string
        default: scripts/check-threshold-drift.sh
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false

permissions:
  contents: read

jobs:
  drift:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-threshold-drift.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e # v6.9.0
    with:
      runs_on: ${{ inputs.runs_on }}
      drift_script: ${{ inputs.drift_script }}
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
