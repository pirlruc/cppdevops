name: C++ Threshold Drift (reusable)

on:
  workflow_call:
    inputs:
      drift_script:
        required: false
        type: string
        default: scripts/check-threshold-drift.sh
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false

permissions:
  contents: read

jobs:
  drift:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-threshold-drift.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      drift_script: ${{ inputs.drift_script }}
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
