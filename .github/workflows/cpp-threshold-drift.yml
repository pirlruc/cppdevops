name: C++ Threshold Drift (reusable)

on:
  workflow_call:
    inputs:
      drift_script:
        required: false
        type: string
        default: scripts/check-threshold-drift.sh
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false

permissions:
  contents: read

jobs:
  drift:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-threshold-drift.yml@e41270c45b858cfa7a9f8404eaee781b5c29b61c
    with:
      drift_script: ${{ inputs.drift_script }}
      scripts_ref: e41270c45b858cfa7a9f8404eaee781b5c29b61c
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
