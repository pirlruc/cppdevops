name: C++ Dynamic analysis (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      run_valgrind:
        required: false
        type: boolean
        default: true
      run_asan:
        required: false
        type: boolean
        default: true

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  asan:
    if: inputs.run_asan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364edf1e46 # v4.2.2

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libc++-dev libc++abi-dev

      - name: Configure ASan/UBSan (ci-asan preset)
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          # Org expectation CPP-DYN-001: use library CMakePresets.json `ci-asan`
          cmake --preset ci-asan
          # Build full tree (build preset may target only the library)
          cmake --build build-asan -j

      - name: Test under ASan/UBSan
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  valgrind:
    if: inputs.run_valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364edf1e46 # v4.2.2

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libc++-dev libc++abi-dev valgrind

      - name: Configure
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          cmake -B build-vg -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DIMPROC_WITH_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++"
          cmake --build build-vg -j

      - name: Memcheck
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          # Run ctest under valgrind via CTEST_MEMORYCHECK
          ctest --test-dir build-vg -T memcheck --output-on-failure || \
            valgrind --leak-check=full --error-exitcode=1 \
              --gen-suppressions=all \
              $(find build-vg -type f -executable -name '*test*' | head -1)
