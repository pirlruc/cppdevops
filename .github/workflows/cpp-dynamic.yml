name: C++ Dynamic analysis (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      run_valgrind:
        required: false
        type: boolean
        default: true
      run_asan:
        required: false
        type: boolean
        default: true
    secrets:
      checkout_token:
        required: false

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  asan:
    if: inputs.run_asan
    runs-on: ubuntu-24.04
    container: ghcr.io/pirlruc/ci-cpp@sha256:54ea6b2354709b742a3b1ae289b82c0cbb1ad9241d59ee06b94331ecf945d7f9
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: dynamic-asan-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Configure ASan/UBSan (ci-asan preset)
        id: configure
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        run: |
          set -euo pipefail
          # Org expectation CPP-DYN-001: use library CMakePresets.json `ci-asan`
          cmake --preset ci-asan
          # Build full tree (build preset may target only the library)
          cmake --build build-asan -j

      - name: Test under ASan/UBSan
        id: asan_test
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          ctest --test-dir build-asan --output-on-failure

      - name: Gate — ASan
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          CONFIGURE: ${{ steps.configure.outcome }}
          ASAN_TEST: ${{ steps.asan_test.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            configure="${CONFIGURE}" \
            asan_test="${ASAN_TEST}"

  valgrind:
    if: inputs.run_valgrind
    runs-on: ubuntu-24.04
    container: ghcr.io/pirlruc/ci-cpp@sha256:54ea6b2354709b742a3b1ae289b82c0cbb1ad9241d59ee06b94331ecf945d7f9
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: dynamic-valgrind-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Configure
        id: configure
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        run: |
          set -euo pipefail
          cmake -B build-vg -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPIRLRUC_WITH_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++"
          cmake --build build-vg -j

      - name: Memcheck
        id: memcheck
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        run: |
          # CPP-DYN-001 / CI-035: fail closed when memcheck cannot run.
          # `ctest -T memcheck` without MEMORYCHECK_COMMAND is a documented
          # no-op and must not pass green. Do not valgrind an empty ${BINS[0]}.
          if ! command -v valgrind >/dev/null 2>&1; then
            echo "::error::valgrind not on PATH; memcheck cannot run (CI-035)"
            exit 1
          fi
          mapfile -t BINS < <(find build-vg -type f -executable -name '*test*' | sort)
          if [[ ${#BINS[@]} -eq 0 || -z "${BINS[0]:-}" ]]; then
            echo "::error::no test binaries under build-vg; memcheck cannot run (CI-035)"
            exit 1
          fi
          rc=0
          for bin in "${BINS[@]}"; do
            echo "valgrind --leak-check=full ${bin}"
            valgrind --leak-check=full --error-exitcode=1 "${bin}" || rc=1
          done
          exit "${rc}"

      - name: Gate — valgrind
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          CONFIGURE: ${{ steps.configure.outcome }}
          MEMCHECK: ${{ steps.memcheck.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            configure="${CONFIGURE}" \
            memcheck="${MEMCHECK}"
