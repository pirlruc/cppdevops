name: C++ Dynamic analysis (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      run_valgrind:
        required: false
        type: boolean
        default: true
      run_asan:
        required: false
        type: boolean
        default: true
      scripts_ref:
        description: Commit SHA matching the uses pin (required cross-repo, CI-034)
        required: false
        type: string
        default: ""
      container_image:
        description: Image for the analysis jobs. Default is ci-cpp. Pass ci-cpp-vcpkg for manifest builds.
        required: false
        type: string
        default: ghcr.io/pirlruc/ci-cpp@sha256:94667c573a1fe4a08aa333cd4083a53553d394c34a8d854d12912831b5536cde
      use_vcpkg:
        description: Run vcpkg manifest mode with a files binary cache. The image must set VCPKG_ROOT.
        required: false
        type: boolean
        default: false
      vcpkg_triplet:
        description: Triplet for manifest installs. ci-cpp images ship x64-linux-libcxx.
        required: false
        type: string
        default: ""

    secrets:
      checkout_token:
        required: false

# CI-025: workflow permissions are the union of the job permissions.
permissions:
  actions: write
  contents: read

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  asan:
    if: inputs.run_asan
    runs-on: ubuntu-24.04
    # Default input is a digest. Callers that override must pass a digest too.
    # zizmor: ignore[unpinned-images]
    container: ${{ inputs.container_image }}
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    env:
      USE_VCPKG: ${{ inputs.use_vcpkg }}
      VCPKG_TRIPLET: ${{ inputs.vcpkg_triplet }}
    concurrency:
      group: dynamic-asan-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Restore vcpkg binary cache
        if: inputs.use_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-${{ inputs.vcpkg_triplet }}-${{ inputs.library_path }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      - name: Prepare vcpkg
        if: inputs.use_vcpkg
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ secrets.checkout_token }}
        run: sh _cppdevops/scripts/prepare-vcpkg.sh

      - name: Configure ASan/UBSan (ci-asan preset)
        id: configure
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        run: |
          set -euo pipefail
          # Org expectation CPP-DYN-001: use library CMakePresets.json `ci-asan`
          sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" --preset ci-asan
          # Build full tree (build preset may target only the library)
          cmake --build build-asan -j

      - name: Test under ASan/UBSan
        id: asan_test
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          ctest --test-dir build-asan --output-on-failure

      - name: Gate — ASan
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          CONFIGURE: ${{ steps.configure.outcome }}
          ASAN_TEST: ${{ steps.asan_test.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            configure="${CONFIGURE}" \
            asan_test="${ASAN_TEST}"

  valgrind:
    if: inputs.run_valgrind
    runs-on: ubuntu-24.04
    # Default input is a digest. Callers that override must pass a digest too.
    # zizmor: ignore[unpinned-images]
    container: ${{ inputs.container_image }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    env:
      USE_VCPKG: ${{ inputs.use_vcpkg }}
      VCPKG_TRIPLET: ${{ inputs.vcpkg_triplet }}
    concurrency:
      group: dynamic-valgrind-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Restore vcpkg binary cache
        if: inputs.use_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-${{ inputs.vcpkg_triplet }}-${{ inputs.library_path }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      - name: Prepare vcpkg
        if: inputs.use_vcpkg
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ secrets.checkout_token }}
        run: sh _cppdevops/scripts/prepare-vcpkg.sh

      - name: Configure
        id: configure
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        run: |
          set -euo pipefail
          sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" -B build-vg -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPIRLRUC_WITH_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++"
          cmake --build build-vg -j

      - name: Memcheck
        id: memcheck
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        run: |
          # CPP-DYN-001 / CI-035: fail closed when memcheck cannot run.
          # `ctest -T memcheck` without MEMORYCHECK_COMMAND is a documented
          # no-op and must not pass green. Do not valgrind an empty ${BINS[0]}.
          if ! command -v valgrind >/dev/null 2>&1; then
            echo "::error::valgrind not on PATH; memcheck cannot run (CI-035)"
            exit 1
          fi
          mapfile -t BINS < <(find build-vg -type f -executable -name '*test*' | sort)
          if [[ ${#BINS[@]} -eq 0 || -z "${BINS[0]:-}" ]]; then
            echo "::error::no test binaries under build-vg; memcheck cannot run (CI-035)"
            exit 1
          fi
          rc=0
          for bin in "${BINS[@]}"; do
            echo "valgrind --leak-check=full ${bin}"
            valgrind --leak-check=full --error-exitcode=1 "${bin}" || rc=1
          done
          exit "${rc}"

      - name: Gate — valgrind
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          CONFIGURE: ${{ steps.configure.outcome }}
          MEMCHECK: ${{ steps.memcheck.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            configure="${CONFIGURE}" \
            memcheck="${MEMCHECK}"
