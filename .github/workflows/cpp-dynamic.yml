name: C++ Dynamic analysis (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      blocking:
        required: false
        type: boolean
        default: false
      run_valgrind:
        required: false
        type: boolean
        default: true
      run_asan:
        required: false
        type: boolean
        default: true

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  asan:
    if: inputs.run_asan
    runs-on: ubuntu-24.04
    # Prefer :local for host-built images until ghcr.io/pirlruc/ci-cpp is published.
    container: ghcr.io/pirlruc/ci-cpp@sha256:54ea6b2354709b742a3b1ae289b82c0cbb1ad9241d59ee06b94331ecf945d7f9
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: dynamic-asan-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure ASan/UBSan (ci-asan preset)
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          # Org expectation CPP-DYN-001: use library CMakePresets.json `ci-asan`
          cmake --preset ci-asan
          # Build full tree (build preset may target only the library)
          cmake --build build-asan -j

      - name: Test under ASan/UBSan
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  valgrind:
    if: inputs.run_valgrind
    runs-on: ubuntu-24.04
    # Prefer :local for host-built images until ghcr.io/pirlruc/ci-cpp is published.
    container: ghcr.io/pirlruc/ci-cpp@sha256:54ea6b2354709b742a3b1ae289b82c0cbb1ad9241d59ee06b94331ecf945d7f9
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: dynamic-valgrind-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          cmake -B build-vg -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPIRLRUC_WITH_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++"
          cmake --build build-vg -j

      - name: Memcheck
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          # Run ctest under valgrind via CTEST_MEMORYCHECK
          mapfile -t BINS < <(find build-vg -type f -executable -name '*test*' | head -1)
          ctest --test-dir build-vg -T memcheck --output-on-failure || \
            valgrind --leak-check=full --error-exitcode=1 \
              --gen-suppressions=all \
              "${BINS[0]}"
