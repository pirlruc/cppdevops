name: Cppdevops CI (self)

# Deterministic infra lint + threshold drift. Time-varying security stays on
# cppdevops-security.yml (schedule). Secret jobs skip Dependabot by pull
# request author (CI-024). pins, scaffold, and lint-dependabot stay token-free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 / CI-031
permissions: {}

jobs:
  pins:
    # Token-free (CI-024): Dependabot PRs still get a submodule pin signal.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SC-DEP-004 submodule pin assert
        run: sh scripts/check-submodule-pins.sh

  scaffold:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      scripts_ref: 8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  lint-dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    container: ghcr.io/pirlruc/ci-lint@sha256:e0a51c64b004c6f4e4ca1672f3bb865aaf03d91bd8a2e228e0fa39be1174dfb4
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: actionlint -color=false .github/workflows/*.yml
      - name: shellcheck
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck
      - name: hadolint
        run: hadolint docker/ci-cpp/Dockerfile
      - name: zizmor
        run: zizmor --min-severity=low -c .github/config/zizmor.yml .github/workflows

  docs:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      shell_scripts: scripts/*.sh
      ruff_paths: scripts/lint-doc-links.py scripts/validate-yaml.py
      yaml_files: docs/issues.yml docs/guardrail-deviations.yml .github/dependabot.yml
      yaml_globs: .github/workflows/*.yml
      run_link_lint: true
      scripts_ref: 8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  infra-lint:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    with:
      # Push/PR are blocking; workflow_dispatch honours the input.
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      shell_scripts: scripts/*.sh
      dockerfiles: docker/ci-cpp/Dockerfile
      scripts_ref: 8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  threshold-drift:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # COMMONDEVOPS_READ_TOKEN is not a fallback: it may lack contents:read on
      # pirlruc/guardrails and then 403s. Cross-repo checkout needs this PAT.
      GUARDRAILS_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require GUARDRAILS_READ_TOKEN
        id: token
        run: |
          set -euo pipefail
          if [ -z "${GUARDRAILS_TOKEN}" ]; then
            echo "::error::GUARDRAILS_READ_TOKEN is required. Dependabot skips this job; every other run checks content drift." >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD:docs/guardrails)" >> "$GITHUB_OUTPUT"
      - name: Clear gitlink placeholder
        run: rm -rf docs/guardrails
      - name: Checkout pinned guardrails gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/guardrails
          ref: ${{ steps.token.outputs.sha }}
          token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
          persist-credentials: false
          path: docs/guardrails
          sparse-checkout: |
            cpp/profile.thresholds.yml
          sparse-checkout-cone-mode: false
      - name: Drift-check vendored C++ thresholds
        run: bash scripts/check-threshold-drift.sh
