name: C++ Devcontainer (reusable)

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      dockerfile:
        required: false
        type: string
        default: .devcontainer/Dockerfile
      dockerfiles:
        required: false
        type: string
        default: ""
      working_directory:
        required: false
        type: string
        default: .
      structure_test_config:
        required: false
        type: string
        default: ""
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: Must match the caller's uses pin of this workflow
        required: false
        type: string
        default: ""
      runner_image:
        required: false
        type: string
        default: ""
    secrets:
      scripts_token:
        required: false

permissions:
  contents: read

jobs:
  devcontainer:
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-devcontainer.yml@fed77f9e664dd3727f28931f2a6f618406fc36c9
    with:
      runs_on: ${{ inputs.runs_on }}
      dockerfile: ${{ inputs.dockerfile }}
      dockerfiles: ${{ inputs.dockerfiles }}
      working_directory: ${{ inputs.working_directory }}
      structure_test_config: ${{ inputs.structure_test_config }}
      blocking: ${{ inputs.blocking }}
      scripts_ref: fed77f9e664dd3727f28931f2a6f618406fc36c9
      runner_image: ${{ inputs.runner_image }}
    secrets:
      scripts_token: ${{ secrets.scripts_token }}
