name: C++ Quality (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        description: Path to library folder (e.g. traits, core, drawer)
        required: true
        type: string
      blocking:
        description: When false, failures are advisory only (WP1/M1)
        required: false
        type: boolean
        default: false
      statement_coverage:
        description: Minimum statement coverage percent
        required: false
        type: string
        default: '95'
      branch_coverage:
        description: Minimum branch coverage percent
        required: false
        type: string
        default: '95'
      max_cyclomatic_complexity:
        description: Maximum CCN per function
        required: false
        type: string
        default: '10'

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: quality-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.library_path }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364edf1e46 # v4.2.2

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck cpplint python3-pip
          pip3 install lizard

      - name: clang-format
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          find include src -name '*.cpp' -o -name '*.hpp' -o -name '*.h' 2>/dev/null | \
            xargs -r clang-format --dry-run --Werror

      - name: cpplint
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          if [ -f ../.cpplint ]; then CPPLINT=../.cpplint; elif [ -f ../../.cpplint ]; then CPPLINT=../../.cpplint; else CPPLINT=../../.cpplint; fi
          find include src -name '*.cpp' -o -name '*.hpp' 2>/dev/null | head -200 | \
            xargs -r cpplint --filter=-build/include_subdir --linelength=120 2>/dev/null || true

      - name: lizard complexity
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          lizard include src -l cpp -C ${{ inputs.max_cyclomatic_complexity }} -w || true
