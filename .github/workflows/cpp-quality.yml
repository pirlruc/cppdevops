name: C++ Quality (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        description: Path to library folder (e.g. . or traits)
        required: true
        type: string
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: Commit SHA matching the uses pin (required cross-repo, CI-034)
        required: false
        type: string
        default: ""
      container_image:
        description: Image for this job. Default is ci-cpp. Pass ci-cpp-vcpkg for manifest builds.
        required: false
        type: string
        default: docker.io/pirlruc/ci-cpp@sha256:28db91b4a240ec459e90afedf07d9ed5030e3733933c82944127a156bca711d3
      use_vcpkg:
        description: Run vcpkg manifest mode with a files binary cache. The image must set VCPKG_ROOT.
        required: false
        type: boolean
        default: false
      vcpkg_triplet:
        description: Triplet for manifest installs. ci-cpp images ship x64-linux-libcxx.
        required: false
        type: string
        default: ""

    secrets:
      checkout_token:
        required: false

# CI-025: workflow permissions are the union of the job permissions.
permissions:
  actions: write
  contents: read

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    # Default input is a digest. Callers that override must pass a digest too.
    # zizmor: ignore[unpinned-images]
    container:
      image: ${{ inputs.container_image }}
      options: --user root
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    env:
      USE_VCPKG: ${{ inputs.use_vcpkg }}
      VCPKG_TRIPLET: ${{ inputs.vcpkg_triplet }}
    concurrency:
      group: quality-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.library_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Restore vcpkg binary cache
        if: inputs.use_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-${{ inputs.vcpkg_triplet }}-${{ inputs.library_path }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      - name: Prepare vcpkg
        if: inputs.use_vcpkg
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ secrets.checkout_token }}
        run: sh _cppdevops/scripts/prepare-vcpkg.sh

      - name: clang-format
        id: clang_format
        continue-on-error: true
        run: |
          dirs=()
          [[ -d include ]] && dirs+=(include)
          [[ -d src ]] && dirs+=(src)
          if [[ ${#dirs[@]} -eq 0 ]]; then echo "No include/src"; exit 0; fi
          find "${dirs[@]}" \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 | \
            xargs -0 -r clang-format --dry-run --Werror

      - name: cpplint
        id: cpplint
        continue-on-error: true
        run: |
          dirs=()
          [[ -d include ]] && dirs+=(include)
          [[ -d src ]] && dirs+=(src)
          if [[ ${#dirs[@]} -eq 0 ]]; then echo "No include/src"; exit 0; fi
          filter="-build/include_subdir,-build/namespaces,-runtime/references,-legal/copyright,-build/header_guard,-build/include_order,-build/c++17,-whitespace/comments,-whitespace/indent_namespace"
          length=120
          if [[ -f .cpplint ]]; then
            line="$(grep -m1 '^filter=' .cpplint || true)"
            if [[ -n "${line}" ]]; then
              filter="${line#filter=},${filter}"
            fi
            line="$(grep -m1 '^linelength=' .cpplint || true)"
            if [[ -n "${line}" ]]; then
              length="${line#linelength=}"
            fi
          fi
          find "${dirs[@]}" \( -name '*.cpp' -o -name '*.hpp' \) -print0 | \
            xargs -0 -r cpplint --recursive --linelength="${length}" --filter="${filter}"

      - name: Configure compile_commands
        id: cmake
        continue-on-error: true
        run: |
          sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" --preset ci-linux -DPIRLRUC_WITH_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON || \
            sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS='-stdlib=libc++'
          cmake --build build -j

      - name: clang-tidy
        id: clang_tidy
        continue-on-error: true
        run: |
          if [[ ! -f build/compile_commands.json ]]; then
            if ! find src -name '*.cpp' -print -quit 2>/dev/null | grep -q .; then
              echo "header-only: no compile_commands; skipping clang-tidy"
              exit 0
            fi
            echo "error: compile_commands.json missing (CI-035)" >&2
            exit 1
          fi
          dirs=()
          [[ -d include ]] && dirs+=(include)
          [[ -d src ]] && dirs+=(src)
          if [[ ${#dirs[@]} -eq 0 ]]; then echo "No include/src"; exit 0; fi
          mapfile -t ALL < <(find "${dirs[@]}" \( -name '*.cpp' -o -name '*.hpp' \) | sort)
          if [[ ${#ALL[@]} -eq 0 ]]; then
            echo "No sources"
            exit 0
          fi
          if [[ ${#ALL[@]} -gt 400 ]]; then
            echo "error: clang-tidy would truncate ${#ALL[@]} TUs to 400 (CI-035)" >&2
            exit 1
          fi
          clang-tidy -p build "${ALL[@]}"

      - name: cppcheck
        id: cppcheck
        continue-on-error: true
        run: |
          dirs=()
          [[ -d include ]] && dirs+=(include)
          [[ -d src ]] && dirs+=(src)
          if [[ ${#dirs[@]} -eq 0 ]]; then echo "No include/src"; exit 0; fi
          # Cppcheck 2.17 scans only *.cpp in a directory. Headers must be named.
          mapfile -t FILES < <(find "${dirs[@]}" \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.tpp' \) | sort)
          if [[ ${#FILES[@]} -eq 0 ]]; then echo "No C++ sources"; exit 0; fi
          SUPP=cppcheck-suppressions.xml
          EXTRA=()
          # The scaffold file is XML. cppcheck --suppressions-list expects plain text.
          if [[ -f "$SUPP" ]] && ! head -n 1 "$SUPP" | grep -q '<?xml'; then
            EXTRA=(--suppressions-list="$SUPP")
          fi
          cppcheck --enable=warning,style,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --std=c++20 "${EXTRA[@]}" "${FILES[@]}"

      - name: lizard complexity
        id: lizard
        continue-on-error: true
        env:
          CPPDEVOPS_SCRIPTS: ${{ github.workspace }}/_cppdevops/scripts
        run: |
          set -euo pipefail
          dirs=()
          [[ -d include ]] && dirs+=(include)
          [[ -d src ]] && dirs+=(src)
          if [[ ${#dirs[@]} -eq 0 ]]; then echo "No include/src"; exit 0; fi
          CCN="$(bash "${CPPDEVOPS_SCRIPTS}/read-thresholds.sh" max_cyclomatic_complexity)"
          lizard "${dirs[@]}" -l cpp -C "$CCN" -w

      - name: Metrix++ maintainability
        id: metrix
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          LIBRARY_PATH: ${{ inputs.library_path }}
        run: |
          bash _cppdevops/scripts/run-metrixpp.sh "${LIBRARY_PATH}"

      - name: Gate — quality
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ADVISORY: ${{ env.ADVISORY }}
          FMT: ${{ steps.clang_format.outcome }}
          LINT: ${{ steps.cpplint.outcome }}
          CMAKE: ${{ steps.cmake.outcome }}
          TIDY: ${{ steps.clang_tidy.outcome }}
          CPPCHECK: ${{ steps.cppcheck.outcome }}
          LIZARD: ${{ steps.lizard.outcome }}
          METRIX: ${{ steps.metrix.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            clang_format="${FMT}" \
            cpplint="${LINT}" \
            cmake="${CMAKE}" \
            clang_tidy="${TIDY}" \
            cppcheck="${CPPCHECK}" \
            lizard="${LIZARD}" \
            metrix="${METRIX}"
