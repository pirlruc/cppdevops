name: C++ Quality (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        description: Path to library folder (e.g. . or traits)
        required: true
        type: string
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      statement_coverage:
        required: false
        type: string
        default: '95'
      branch_coverage:
        required: false
        type: string
        default: '95'
      max_cyclomatic_complexity:
        required: false
        type: string
        default: '10'
    secrets:
      checkout_token:
        required: false

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    # Prefer :local for host-built images until ghcr.io/pirlruc/ci-cpp is published.
    container: ghcr.io/pirlruc/ci-cpp:latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: quality-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.library_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
            docs/guardrails/cpp
          sparse-checkout-cone-mode: false

      - name: clang-format
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          find include src -name '*.cpp' -o -name '*.hpp' -o -name '*.h' 2>/dev/null | \
            xargs -r clang-format --dry-run --Werror

      - name: cpplint
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          find include src \( -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null | \
            xargs -r cpplint --recursive --linelength=120

      - name: Configure compile_commands
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          cmake --preset ci-linux -DPIRLRUC_WITH_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON || \
            cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS='-stdlib=libc++'
          cmake --build build -j

      - name: clang-tidy
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          if [[ ! -f build/compile_commands.json ]]; then
            echo "compile_commands.json missing — skip clang-tidy"
            exit 0
          fi
          mapfile -t SRC < <(find include src \( -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null | head -400)
          if [[ ${#SRC[@]} -eq 0 ]]; then
            echo "No sources"
            exit 0
          fi
          clang-tidy -p build "${SRC[@]}"

      - name: cppcheck
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          SUPP=cppcheck-suppressions.xml
          EXTRA=()
          [[ -f "$SUPP" ]] && EXTRA=(--suppressions-list="$SUPP")
          cppcheck --enable=warning,style,performance,portability \
            --error-exitcode=1 --inline-suppr \
            --std=c++20 "${EXTRA[@]}" include src

      - name: lizard complexity
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          lizard include src -l cpp -C ${{ inputs.max_cyclomatic_complexity }} -w

      - name: Metrix++ maintainability
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          bash _cppdevops/scripts/run-metrixpp.sh "${{ inputs.library_path }}"
