name: Cppdevops Security (scheduled)

# Time-varying gates: secrets/SAST, supply-chain, published ci-cpp rescan.
# Deterministic lint stays on push/PR (cppdevops-ci.yml).

on:
  schedule:
    # Weekly Wednesday 06:17 UTC — staggered vs commondevops (Mon) / containerdevops (Tue).
    - cron: "17 6 * * 3"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: cppdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025
permissions: {}

jobs:
  secrets-sast:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@bcddb5db4ba5d291aa7f434d447e43175f14136c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: bcddb5db4ba5d291aa7f434d447e43175f14136c
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  supply-chain:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@bcddb5db4ba5d291aa7f434d447e43175f14136c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: bcddb5db4ba5d291aa7f434d447e43175f14136c
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  published-ci-cpp-rescan:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@32384866e5669dbde8bdecde153a6ae6ead728ed
    with:
      # Same digest as reusable cpp-* `container:` pins (CI-018). Do not float
      # on :latest; weekly rescan of a digest still picks up new CVEs.
      image: ghcr.io/pirlruc/ci-cpp@sha256:f42b11bc342c0dd6faef6454f4a37cf4230b9c2c87357623cad5ed0102608656
      scripts_ref: 32384866e5669dbde8bdecde153a6ae6ead728ed
      pkg_types: library
      ignorefile: docker/ci-cpp/.trivyignore.yaml
      results_artifact: published-ci-cpp-scan
      sarif_category: trivy-ci-cpp
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
