name: Cppdevops Security (scheduled)

# Time-varying gates: secrets/SAST, supply-chain, published ci-cpp rescan.
# Deterministic lint stays on push/PR (cppdevops-ci.yml).

on:
  schedule:
    # Weekly Wednesday 06:17 UTC — staggered vs commondevops (Mon) / containerdevops (Tue).
    - cron: "17 6 * * 3"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: cppdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025
permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
      container_image: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111
  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:dc83deb4465d5989a03b14ccabef46c3f3426231048b962c69b8e434a7200d48
  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      blocking: false
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    with:
      scripts_ref: b85f95bbac8ba7d82eb90d1d84d1b8d1e8590a12
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
      containerdevops_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  published-ci-cpp-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@b419c24cbaf09f39d73fa0146a71155f1a4fbd54
    with:
      # Same digest as reusable cpp-* `container:` pins (CI-018). Do not float
      # on :latest; weekly rescan of a digest still picks up new CVEs.
      image: ghcr.io/pirlruc/ci-cpp@sha256:88fd10cb4cf754f190f565f14667fc5eef8cd933326fe2daa84ed0479709f19a
      scripts_ref: b419c24cbaf09f39d73fa0146a71155f1a4fbd54
      pkg_types: library
      ignorefile: docker/ci-cpp/.trivyignore.yaml
      results_artifact: published-ci-cpp-scan
      sarif_category: trivy-ci-cpp
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
