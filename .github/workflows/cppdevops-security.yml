name: Cppdevops Security (scheduled)

# Time-varying gates: secrets/SAST, supply-chain, published ci-cpp rescan.
# Deterministic lint stays on push/PR (cppdevops-ci.yml).

on:
  schedule:
    # Weekly Wednesday 06:17 UTC — staggered vs commondevops (Mon) / containerdevops (Tue).
    - cron: "17 6 * * 3"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: cppdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025
permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
      container_image: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111
  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:dc83deb4465d5989a03b14ccabef46c3f3426231048b962c69b8e434a7200d48
  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      blocking: false
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
      containerdevops_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  published-ci-cpp-rescan:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      # Same digest as reusable cpp-* `container:` pins (CI-018). Do not float
      # on :latest; weekly rescan of a digest still picks up new CVEs.
      image: ghcr.io/pirlruc/ci-cpp@sha256:3f4776490bcf197fc10983e416443d01f365134df44110c24176f5b2ded09475
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      pkg_types: library
      ignorefile: docker/ci-cpp/.trivyignore.yaml
      results_artifact: published-ci-cpp-scan
      sarif_category: trivy-ci-cpp
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  security-aggregate:
    if: always()
    needs: [secrets-sast, supply-chain, scorecard, token-audit, published-ci-cpp-rescan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail when a security job failed
        env:
          SECRETS: ${{ needs.secrets-sast.result }}
          SUPPLY: ${{ needs.supply-chain.result }}
          SCORE: ${{ needs.scorecard.result }}
          TOKEN: ${{ needs.token-audit.result }}
          RESCAN: ${{ needs.published-ci-cpp-rescan.result }}
        run: |
          set -eu
          failed=""
          for item in "secrets-sast=${SECRETS}" "supply-chain=${SUPPLY}" "scorecard=${SCORE}" "token-audit=${TOKEN}" "rescan=${RESCAN}"; do
            name=${item%%=*}
            result=${item#*=}
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              failed="${failed} ${name}(${result})"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::Security jobs failed:${failed}"
            exit 1
          fi
          echo "Security aggregate passed."
