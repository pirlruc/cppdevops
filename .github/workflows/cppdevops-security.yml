name: Cppdevops Security (scheduled)

# Time-varying gates: secrets/SAST, supply-chain, published ci-cpp rescan.
# Deterministic lint stays on push/PR (cppdevops-ci.yml).

on:
  schedule:
    # Weekly Wednesday 06:17 UTC — staggered vs commondevops (Mon) / containerdevops (Tue).
    - cron: "17 6 * * 3"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: cppdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025
permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 8aad4ba4a597a87565d6d3d1a92a8bdd7568921c
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  published-ci-cpp-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@edef9c8413363c46dcb276f5188a033d9fc6fd4e
    with:
      # Same digest as reusable cpp-* `container:` pins (CI-018). Do not float
      # on :latest; weekly rescan of a digest still picks up new CVEs.
      image: ghcr.io/pirlruc/ci-cpp@sha256:cf40f3bc99ebe50a286d1e57ac0aa63c28678ef44e65b3a6dbef0c7420afa47f
      scripts_ref: edef9c8413363c46dcb276f5188a033d9fc6fd4e
      pkg_types: library
      ignorefile: docker/ci-cpp/.trivyignore.yaml
      results_artifact: published-ci-cpp-scan
      sarif_category: trivy-ci-cpp
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
