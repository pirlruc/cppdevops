name: Cppdevops Security (scheduled)

# Time-varying gates: secrets/SAST, supply-chain, published ci-cpp rescan.
# Deterministic lint stays on push/PR (cppdevops-ci.yml).

on:
  schedule:
    # Weekly Wednesday 06:17 UTC — staggered vs commondevops (Mon) / containerdevops (Tue).
    - cron: "17 6 * * 3"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: cppdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025
permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e # v6.9.0
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e
      container_image: ghcr.io/pirlruc/ci-lint@sha256:3ed6d8dcbb08abf82e563630f2c1218cf0e8f33bb883ed46770e147113af48b0
  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e # v6.9.0
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:cceea28e7719138294d11396fa3b9ebdb078d5997de6b4454b9e3f14e33d5133
  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e # v6.9.0
    with:
      blocking: false
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e # v6.9.0
    with:
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  published-ci-cpp-rescan:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      # Same digest as reusable cpp-* `container:` pins (CI-018). Do not float
      # on :latest; weekly rescan of a digest still picks up new CVEs.
      image: ghcr.io/pirlruc/ci-cpp@sha256:c805d32471c3d05997922ee7ffdf1f4cf3fc6cfbf09a5eaf4cbbae0639786e84
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: library
      ignorefile: docker/ci-cpp/.trivyignore.yaml
      results_artifact: published-ci-cpp-scan
      sarif_category: trivy-image-ci-cpp
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  published-ci-cpp-alpine-rescan:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-cpp:6.8.0-alpine@sha256:fe26b9e8731a5d47c1b241f60f0d082c44bac4f85874ae3a414a5434f411e815
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: library
      ignorefile: docker/ci-cpp/.trivyignore.yaml
      results_artifact: published-ci-cpp-alpine-scan
      sarif_category: trivy-image-ci-cpp-alpine
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  published-ci-cpp-opencv-rescan:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-cpp-opencv:6.8.0@sha256:4aafa2849cf86791b8e66dac37ccb7fe0c934195b472f766e2542b06f1e2a845
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: library
      ignorefile: docker/ci-cpp-opencv/.trivyignore.yaml
      results_artifact: published-ci-cpp-opencv-scan
      sarif_category: trivy-image-ci-cpp-opencv
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  published-posture-ci-cpp:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-cpp:6.8.0@sha256:c805d32471c3d05997922ee7ffdf1f4cf3fc6cfbf09a5eaf4cbbae0639786e84
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-posture-ci-cpp
      sarif_category: trivy-posture-ci-cpp
      blocking: false

  published-posture-ci-cpp-alpine:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-cpp:6.8.0-alpine@sha256:fe26b9e8731a5d47c1b241f60f0d082c44bac4f85874ae3a414a5434f411e815
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-posture-ci-cpp-alpine
      sarif_category: trivy-posture-ci-cpp-alpine
      blocking: false

  published-posture-ci-cpp-opencv:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-cpp-opencv:6.8.0@sha256:4aafa2849cf86791b8e66dac37ccb7fe0c934195b472f766e2542b06f1e2a845
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-posture-ci-cpp-opencv
      sarif_category: trivy-posture-ci-cpp-opencv
      blocking: false

  security-aggregate:
    if: always()
    needs: [secrets-sast, supply-chain, scorecard, token-audit, published-ci-cpp-rescan, published-ci-cpp-alpine-rescan, published-ci-cpp-opencv-rescan, published-posture-ci-cpp, published-posture-ci-cpp-alpine, published-posture-ci-cpp-opencv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail when a security job failed
        env:
          SECRETS: ${{ needs.secrets-sast.result }}
          SUPPLY: ${{ needs.supply-chain.result }}
          SCORE: ${{ needs.scorecard.result }}
          TOKEN: ${{ needs.token-audit.result }}
          RESCAN: ${{ needs.published-ci-cpp-rescan.result }}
          ALPINE: ${{ needs.published-ci-cpp-alpine-rescan.result }}
          OPENCV: ${{ needs.published-ci-cpp-opencv-rescan.result }}
          POSTURE: ${{ needs.published-posture-ci-cpp.result }}
          POSTURE_ALPINE: ${{ needs.published-posture-ci-cpp-alpine.result }}
          POSTURE_OPENCV: ${{ needs.published-posture-ci-cpp-opencv.result }}
        run: |
          set -eu
          failed=""
          for item in "secrets-sast=${SECRETS}" "supply-chain=${SUPPLY}" "scorecard=${SCORE}" "token-audit=${TOKEN}" "rescan=${RESCAN}" "alpine=${ALPINE}" "opencv=${OPENCV}" "posture=${POSTURE}" "posture-alpine=${POSTURE_ALPINE}" "posture-opencv=${POSTURE_OPENCV}"; do
            name=${item%%=*}
            result=${item#*=}
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              failed="${failed} ${name}(${result})"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::Security jobs failed:${failed}"
            exit 1
          fi
          echo "Security aggregate passed."
