# Push C++ image Docker Hub Overviews without rebuilding the images.
# The called workflow is containerdevops 6.8.0.
# Push to main when a Hub page changes. A release event republishes images.
# ci-cpp-ubuntu and ci-cpp-vcpkg have no Docker Hub repository.

name: Hub description

on:
  push:
    branches: [main]
    paths:
      - "docs/docker-hub*.md"
      - ".github/workflows/hub-description.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-description-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-cpp:
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-hub-description.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      dockerhub_image: pirlruc/ci-cpp
      dockerhub_readme: docs/docker-hub-ci-cpp.md
      dockerhub_short_description: >-
        C++ CI toolchain: Clang/libc++, CMake, Ninja, quality and coverage tools
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}

  ci-cpp-opencv:
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-hub-description.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      dockerhub_image: pirlruc/ci-cpp-opencv
      dockerhub_readme: docs/docker-hub-ci-cpp-opencv.md
      dockerhub_short_description: C++ compile image with OpenCV 4.14 and Eigen 3.4
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
