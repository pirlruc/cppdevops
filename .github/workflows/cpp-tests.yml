name: C++ Tests (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      cmake_preset:
        required: false
        type: string
        default: ci-linux
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: Commit SHA matching the uses pin (required cross-repo, CI-034)
        required: false
        type: string
        default: ""
      container_image:
        description: Image for the tests job. Default is ci-cpp. Pass ci-cpp-vcpkg for manifest builds.
        required: false
        type: string
        default: docker.io/pirlruc/ci-cpp@sha256:28db91b4a240ec459e90afedf07d9ed5030e3733933c82944127a156bca711d3
      use_vcpkg:
        description: Run vcpkg manifest mode with a files binary cache. The image must set VCPKG_ROOT.
        required: false
        type: boolean
        default: false
      vcpkg_triplet:
        description: Triplet for manifest installs. ci-cpp images ship x64-linux-libcxx.
        required: false
        type: string
        default: ""

    secrets:
      checkout_token:
        required: false

# CI-025: workflow permissions are the union of the job permissions.
permissions:
  actions: write
  contents: read

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    # Default input is a digest. Callers that override must pass a digest too.
    # zizmor: ignore[unpinned-images]
    container:
      image: ${{ inputs.container_image }}
      options: --user root
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    env:
      USE_VCPKG: ${{ inputs.use_vcpkg }}
      VCPKG_TRIPLET: ${{ inputs.vcpkg_triplet }}
    concurrency:
      group: tests-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Restore vcpkg binary cache
        if: inputs.use_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.vcpkg-bin
          key: vcpkg-${{ inputs.vcpkg_triplet }}-${{ inputs.library_path }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: vcpkg-

      - name: Prepare vcpkg
        if: inputs.use_vcpkg
        working-directory: ${{ github.workspace }}
        env:
          CHECKOUT_TOKEN: ${{ secrets.checkout_token }}
        run: sh _cppdevops/scripts/prepare-vcpkg.sh

      - name: Configure and build
        id: build
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        env:
          CMAKE_PRESET: ${{ inputs.cmake_preset }}
        run: |
          # Use gcov-compatible --coverage (not llvm source-based profiling) so
          # check-coverage.sh / gcovr can produce a numeric coverage.json.
          sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" --preset "${CMAKE_PRESET}" \
            -DPIRLRUC_WITH_TESTS=ON \
            -DPIRLRUC_WITH_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ --coverage" \
            || sh "${GITHUB_WORKSPACE}/_cppdevops/scripts/cmake-ci.sh" -B build \
              -DPIRLRUC_WITH_TESTS=ON \
              -DPIRLRUC_WITH_COVERAGE=ON \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++ --coverage"
          cmake --build build -j

      - name: Run tests
        id: ctest
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        run: ctest --test-dir build --output-on-failure

      - name: Coverage gate
        id: coverage
        continue-on-error: true
        env:
          LIBRARY_PATH: ${{ inputs.library_path }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/check-coverage.sh "${LIBRARY_PATH}"

      - name: Gate — tests
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ADVISORY: ${{ env.ADVISORY }}
          BUILD: ${{ steps.build.outcome }}
          CTEST: ${{ steps.ctest.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            build="${BUILD}" \
            ctest="${CTEST}" \
            coverage="${COVERAGE}"

  ubuntu-compile:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pirlruc/ci-cpp-ubuntu@sha256:08580497f49d79012a03023377216a3ef2e274a7b7616d4f2a155d2d6551ed68
      options: --user root
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, and test
        working-directory: ${{ inputs.library_path }}
        env:
          CMAKE_PRESET: ${{ inputs.cmake_preset }}
        run: |
          cmake --preset "${CMAKE_PRESET}" \
            -DPIRLRUC_WITH_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            || cmake -B build \
              -DPIRLRUC_WITH_TESTS=ON \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++"
          cmake --build build -j
          ctest --test-dir build --output-on-failure
