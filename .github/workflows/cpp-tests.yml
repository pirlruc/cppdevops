name: C++ Tests (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      cmake_preset:
        required: false
        type: string
        default: ci-linux
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: Commit SHA matching the uses pin (required cross-repo, CI-034)
        required: false
        type: string
        default: ""

    secrets:
      checkout_token:
        required: false

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    container: ghcr.io/pirlruc/ci-cpp@sha256:cf40f3bc99ebe50a286d1e57ac0aa63c28678ef44e65b3a6dbef0c7420afa47f
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: tests-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${REPO}" != "pirlruc/cppdevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi


      - name: Configure and build
        id: build
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        env:
          CMAKE_PRESET: ${{ inputs.cmake_preset }}
        run: |
          # Use gcov-compatible --coverage (not llvm source-based profiling) so
          # check-coverage.sh / gcovr can produce a numeric coverage.json.
          cmake --preset "${CMAKE_PRESET}" \
            -DPIRLRUC_WITH_TESTS=ON \
            -DPIRLRUC_WITH_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ --coverage" \
            || cmake -B build \
              -DPIRLRUC_WITH_TESTS=ON \
              -DPIRLRUC_WITH_COVERAGE=ON \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++ --coverage"
          cmake --build build -j

      - name: Run tests
        id: ctest
        continue-on-error: true
        working-directory: ${{ inputs.library_path }}
        run: ctest --test-dir build --output-on-failure

      - name: Coverage gate
        id: coverage
        continue-on-error: true
        env:
          LIBRARY_PATH: ${{ inputs.library_path }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/check-coverage.sh "${LIBRARY_PATH}"

      - name: Gate — tests
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ADVISORY: ${{ env.ADVISORY }}
          BUILD: ${{ steps.build.outcome }}
          CTEST: ${{ steps.ctest.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          set -euo pipefail
          bash _cppdevops/scripts/gate-aggregate.sh \
            build="${BUILD}" \
            ctest="${CTEST}" \
            coverage="${COVERAGE}"
