name: C++ Tests (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      cmake_preset:
        required: false
        type: string
        default: ci-linux
      blocking:
        required: false
        type: boolean
        default: false
      statement_coverage:
        required: false
        type: string
        default: '95'
      branch_coverage:
        required: false
        type: string
        default: '95'
    secrets:
      checkout_token:
        required: false

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    # Prefer :local for host-built images until ghcr.io/pirlruc/ci-cpp is published.
    container: ghcr.io/pirlruc/ci-cpp:latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: tests-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout cppdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/cppdevops
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _cppdevops
          sparse-checkout: |
            scripts
            docs/guardrails/cpp
          sparse-checkout-cone-mode: false

      - name: Configure and build
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          # Use gcov-compatible --coverage (not llvm source-based profiling) so
          # check-coverage.sh / gcovr can produce a numeric coverage.json.
          cmake --preset ${{ inputs.cmake_preset }} \
            -DPIRLRUC_WITH_TESTS=ON \
            -DPIRLRUC_WITH_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ --coverage" \
            || cmake -B build \
              -DPIRLRUC_WITH_TESTS=ON \
              -DPIRLRUC_WITH_COVERAGE=ON \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_CXX_FLAGS="-stdlib=libc++ --coverage"
          cmake --build build -j

      - name: Run tests
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: ctest --test-dir build --output-on-failure

      - name: Coverage gate
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          bash _cppdevops/scripts/check-coverage.sh "${{ inputs.library_path }}"
