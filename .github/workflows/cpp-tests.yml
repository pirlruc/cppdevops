name: C++ Tests (reusable)

on:
  workflow_call:
    inputs:
      library_path:
        required: true
        type: string
      cmake_preset:
        required: false
        type: string
        default: ci-linux
      blocking:
        required: false
        type: boolean
        default: false
      statement_coverage:
        required: false
        type: string
        default: '95'
      branch_coverage:
        required: false
        type: string
        default: '95'

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: tests-${{ inputs.library_path }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364edf1e46 # v4.2.2

      - name: Configure and build
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: |
          cmake --preset ${{ inputs.cmake_preset }} -DIMPROC_WITH_TESTS=ON || \
            cmake -B build -DIMPROC_WITH_TESTS=ON
          cmake --build build -j

      - name: Run tests
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ inputs.library_path }}
        run: ctest --test-dir build --output-on-failure || ctest --test-dir build --output-on-failure -R test
